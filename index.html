<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22D-Series%20Deck%20Lab%22%2C%20%22short_name%22%3A%20%22D-Lab%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%231b1f3a%22%2C%20%22theme_color%22%3A%20%22%231b1f3a%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A//www.w3.org/2000/svg%2527%2520viewBox%253D%25270%25200%252096%252096%2527%253E%253Crect%2520width%253D%252796%2527%2520height%253D%252796%2527%2520rx%253D%252718%2527%2520fill%253D%2527%25231b1f3a%2527/%253E%253Ctext%2520x%253D%252748%2527%2520y%253D%252762%2527%2520font-size%253D%252744%2527%2520text-anchor%253D%2527middle%2527%2520fill%253D%2527%2523f2c14e%2527%2520font-family%253D%2527sans-serif%2527%2520font-weight%253D%2527700%2527%253ED%253C/text%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%7D%5D%7D">
<meta name="theme-color" content="#1b1f3a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>D-Series Deck Lab</title>
<style>
:root{--bg:#0f1218;--panel:#171c26;--panel2:#1e2531;--line:#2a3342;--fg:#e6eaf2;--mute:#8a95a9;--acc:#4fd1c5;--ok:#58d68d;--bad:#ff6b6b;--warn:#f5b041;
--n-dragon:#e0533d;--n-dark:#8e5bd6;--n-keter:#e3b341;--n-brandt:#4a90e2;--n-stoi:#3fb27f;--n-lyrical:#f472b6;--n-other:#8a95a9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0)}
header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.04em;text-transform:uppercase}
header .sp{flex:1}
.pane{min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line);padding-left:max(0px,env(safe-area-inset-left,0px))}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.filters input[type=search]{flex:1 1 160px}
.grid{flex:1;overflow:auto;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--nc,var(--n-other));border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .t1{display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.tile .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:zoom-in}
.tile .meta{color:var(--mute);font-size:12px}
.tile .row{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
.g{font-variant-numeric:tabular-nums;font-weight:700;background:var(--panel2);border-radius:4px;padding:0 6px;font-size:12px;white-space:nowrap}
.trg{color:var(--warn)}
.cnt{margin-left:auto;display:flex;gap:4px;align-items:center}
.cnt button{padding:2px 9px;line-height:1.2}
.cnt b{min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
#right{padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:9px 4px;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc)}
.deckbar{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.deckbar input{flex:1 1 120px}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.chip{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.warn{border-color:var(--warn);color:var(--warn)}
.hist{display:flex;gap:3px;align-items:flex-end;height:44px;padding:6px 12px 0}
.hist div{flex:1;background:var(--acc);opacity:.75;border-radius:2px 2px 0 0;position:relative;min-height:1px}
.hist span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
.histlbl{display:flex;gap:3px;padding:0 12px 4px;font-size:10px;color:var(--mute)}.histlbl span{flex:1;text-align:center}
.list{flex:1;overflow:auto;padding:6px 12px}
.li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:zoom-in}
.li .nm.over{color:var(--bad)}
.empty{color:var(--mute);padding:24px 12px;text-align:center}
.foot{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.foot input{flex:1 1 140px}
#msg{color:var(--mute);font-size:12px;padding:0 12px 6px;min-height:1.2em}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
#loader .box{max-width:440px;text-align:center;display:flex;flex-direction:column;gap:12px}
#loader h2{margin:0}
#loader p{color:var(--mute);margin:0}
.big{background:var(--acc);color:#06201d;border:0;font-weight:700;padding:11px 16px}
#bnav{display:none}
header{position:relative}
#imgMenu{position:absolute;right:12px;top:100%;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:260px}
#imInfo{color:var(--mute);font-size:12px}
.card .pic{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block}
/* zoom */
#zoom{position:fixed;inset:0;background:rgba(5,8,12,.82);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:10px}
#zoom[hidden]{display:none}
.stage{perspective:900px}
.card{width:min(340px,86vw);aspect-ratio:63/88;border-radius:14px;position:relative;transform-style:preserve-3d;transition:transform .12s ease-out;background:linear-gradient(160deg,var(--cc) 0%,#10141c 55%);padding:3px;box-shadow:0 18px 50px rgba(0,0,0,.6);touch-action:none;user-select:none}
.card .in{height:100%;border-radius:11px;background:#121722;padding:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .hd b{font-size:15px;line-height:1.2}
.card .gr{background:var(--cc);color:#0b0e14;font-weight:800;border-radius:6px;padding:1px 8px;white-space:nowrap}
.card .sub{font-size:11px;color:var(--mute)}
.card .st{display:flex;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.card .tx{flex:1;overflow:auto;font-size:11.5px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:6px}
.card .fl{color:var(--mute);font-style:italic}
.card .no{font-size:10.5px;color:var(--mute);display:flex;justify-content:space-between}
.card .holo{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:screen;opacity:.0;transition:opacity .15s;
background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 38%),linear-gradient(115deg,transparent 20%,rgba(255,90,200,.35) 38%,rgba(90,220,255,.35) 50%,rgba(255,240,120,.35) 62%,transparent 80%);background-size:100% 100%,220% 220%;background-position:0 0,var(--bx,50%) var(--by,50%)}
.card.on .holo{opacity:.55}
#zbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media(max-width:820px){
 body{overflow:auto}
 #app{display:block;height:100%}
 #app{display:flex;flex-direction:column}
 #left,#right{flex:1;border:0;min-height:0}
 #app[data-v=cards] #right,#app[data-v=deck] #left{display:none}
 #bnav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0)}
 #bnav button{flex:1;border:0;border-radius:0;padding:12px}
 #bnav button[aria-selected=true]{color:var(--acc)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}

/* play */
#play{position:fixed;inset:0;z-index:18;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);--cw:clamp(50px,13vw,74px)}
#pbar{display:flex;gap:8px;align-items:center;padding:6px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#pbar .sp{flex:1}
#psetup{flex:1;overflow:auto;padding:16px}
.sbox{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sbox label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:12px}
.note{color:var(--mute);font-size:12px}.err{color:var(--bad)}
#pgame{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#pboard{flex:1;min-height:0;overflow:auto}
#pact,#phand{flex:0 0 auto}
.side{padding:6px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:center}
.stats{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.stats button{padding:2px 7px;font-size:12px}
.frow{display:grid;grid-template-columns:repeat(3,var(--cw));gap:6px;justify-content:center}
.cell{position:relative;min-height:calc(var(--cw)*1.4 + 2px);border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
.cell small{position:absolute;top:1px;left:4px;font-size:9px;color:var(--mute)}
.cell.hl{border-color:var(--acc);background:rgba(79,209,197,.14)}
.ch{width:var(--cw);aspect-ratio:63/88;border-radius:6px;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);border-left:3px solid var(--nc,var(--line));position:relative;font-size:10px;line-height:1.15;padding:3px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;flex:0 0 auto}
.ch.hasimg{border-left-width:1px}
.ch b{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ch i{font-style:normal;color:var(--mute)}
.ch.sel{outline:2px solid var(--acc)}
.ch.rest{opacity:.55;filter:saturate(.4)}.ch.rest::after{content:"เรสต์";position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.65);color:#fff;font-size:9px;text-align:center}
.ch.down{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 6px,var(--line) 6px,var(--line) 12px);align-items:center;justify-content:center}
.ch.sm{--cw:38px}
.ch .pw{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:0 3px;border-radius:4px 0 0 0;font-variant-numeric:tabular-nums}
.dmgrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:20px}.dmgrow small{color:var(--mute);font-size:11px}
#pmid{min-height:6px;padding:2px}
#pinfo .tz{display:inline-flex;align-items:center;gap:6px;font-size:12px}
#pact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 12px;border-top:1px solid var(--line);min-height:44px}
#pact .sel{font-weight:600}.hint{color:var(--acc)}.nb{font-size:12px;color:var(--mute)}
#phand{display:flex;gap:6px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);min-height:calc(var(--cw)*1.4 + 20px)}
#plog{position:absolute;right:8px;top:48px;width:min(340px,86vw);max-height:50vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;z-index:3}
#plog div div{padding:1px 0;border-bottom:1px solid var(--line)}
#pmodal{position:absolute;inset:0;background:linear-gradient(rgba(5,8,12,.15),rgba(5,8,12,.75) 45%);display:flex;align-items:flex-end;justify-content:center;padding:8px 8px max(8px,env(safe-area-inset-bottom,0px));z-index:5}
#pmodal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:620px;width:100%;max-height:68vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.6)}
.mbox h2,.mbox h3,.mbox p{margin:0}
.mrow{display:flex;flex-wrap:wrap;gap:6px}.mrow2{display:flex;flex-wrap:wrap;gap:6px}
.mc{width:96px;min-height:64px;display:flex;flex-direction:column;gap:2px;text-align:left;padding:5px;font-size:11px;position:relative}
.mc img{width:100%;border-radius:4px}.mc b{font-weight:600}.mc small{color:var(--mute)}
.mc.on{border-color:var(--acc);outline:2px solid var(--acc)}
.mbtn{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

/* playmat */
.mh{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--mute);width:min(100%,640px)}.mh b{color:var(--fg)}
.mat{--ring:#d6a93a;display:grid;grid-template-columns:.85fr 3fr 1.15fr;gap:8px;width:min(100%,640px);padding:10px 8px;border-radius:14px;background:radial-gradient(120% 90% at 50% 40%,#12151d,#07080c);border:1px solid #2b3140;box-shadow:inset 0 0 0 3px #0d1016,inset 0 0 22px rgba(0,0,0,.7)}
.mat.opp{grid-template-columns:1.15fr 3fr .85fr}
.mat .mm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;align-content:center}
.mat .cell{border:0;min-height:0;aspect-ratio:63/88;border-radius:8px;overflow:visible}
.mat .cell::before{content:"";position:absolute;left:50%;top:50%;width:118%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--ring);box-shadow:0 0 12px var(--ring),inset 0 0 10px var(--ring);opacity:.5;pointer-events:none}
.mat .cell::after{content:"";position:absolute;left:50%;top:50%;width:96%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed var(--ring);opacity:.35;pointer-events:none}
.mat .cell[data-circ=VC]{--ring:#e0463f}
.mat .cell.hl::before{opacity:1;box-shadow:0 0 18px var(--acc),inset 0 0 12px var(--acc);border-color:var(--acc)}
.mat .cell small{z-index:1;opacity:.7}
.mat .cell .ch{width:100%;position:relative;z-index:2}
.mat .lp,.mat .rp{display:grid;gap:6px;align-content:stretch}
.mat .lp{grid-template-rows:auto 1fr}
.mat .rp{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(34px,1fr)}
.zb{background:#0c0e14;border:1px solid #333b4d;border-radius:6px;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px;min-width:0;font-size:12px}
.zb small{font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.zb b{font-variant-numeric:tabular-nums}
.zb.trig{grid-column:1/-1;min-height:46px}.zb.off{opacity:.45}
.zb.dmg{align-items:stretch;justify-content:flex-start}.zb.dmg .dc{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.mat .zb .ch.sm{--cw:30px;width:30px}

/* playmat v2 (felt table, phone-fit) */
#play{--cw:clamp(44px,12vw,64px)}
.mat{--ring:#e0b64a;--mcw:min(clamp(50px,calc((100dvh - 500px)/5.6),88px),calc((100vw - 64px)/3.4));display:flex;flex-direction:column;gap:7px;width:min(100%,520px);padding:9px 10px;border-radius:18px;position:relative;
 background:radial-gradient(130% 110% at 50% 0%,#1f4a52 0%,#143039 52%,#0b1a22 100%);border:1px solid #2f5964;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),inset 0 -24px 40px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.45)}
.mat::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 2px,transparent 2px 7px);pointer-events:none}
.mat.opp{background:radial-gradient(130% 110% at 50% 100%,#3a2a4f 0%,#241c36 52%,#130f20 100%);border-color:#4a3a66}
.mat>*{position:relative}
.mat .mm{display:flex;flex-direction:column;gap:clamp(6px,1.6vw,12px);align-items:center;grid-template-columns:none}
.mrow3{display:grid;grid-template-columns:repeat(3,var(--mcw));gap:clamp(8px,3vw,24px);justify-content:center}
.mat .cell{width:var(--mcw);min-height:0;aspect-ratio:63/88;border:0;border-radius:9px;overflow:visible;background:rgba(0,0,0,.30);box-shadow:inset 0 0 0 1.5px rgba(224,182,74,.6),0 0 12px rgba(224,182,74,.14)}
.mat .cell::before{content:"";position:absolute;left:50%;top:50%;width:54%;aspect-ratio:1;height:auto;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid rgba(224,182,74,.38);box-shadow:none;opacity:1;pointer-events:none}
.mat .cell::after{content:none}
.mat .cell[data-circ=VC]{background:rgba(224,70,63,.12);box-shadow:inset 0 0 0 2px #e0463f,0 0 16px rgba(224,70,63,.5)}
.mat .cell[data-circ=VC]::before{border-color:rgba(224,70,63,.5)}
.mat .cell.hl{background:rgba(79,209,197,.2);box-shadow:inset 0 0 0 2px var(--acc),0 0 18px var(--acc)}
.mat .cell.hl::before{border-color:var(--acc);box-shadow:none}
.mat .cell small{position:absolute;top:2px;left:4px;z-index:1;font-size:9px;opacity:.75;color:#f2d98a}
.mat .cell .ch{width:100%;position:relative;z-index:2;border-radius:7px;box-shadow:0 3px 9px rgba(0,0,0,.6);transition:transform .18s}
.mat .cell .ch.rest{transform:rotate(90deg) scale(.74);opacity:.9;filter:none}.mat .ch.rest::after{content:none}
.mat .mh{width:100%;font-size:11px;gap:6px;flex-wrap:wrap;align-items:center}
.mstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mstrip .zb{padding:2px 0;min-height:34px;background:rgba(6,14,20,.72);border-color:#2f4a58}
.mstrip .zb b{font-size:13px}.mstrip .zb small{font-size:8px;letter-spacing:.06em}
.dmgline{display:flex;gap:6px;align-items:stretch}
.dmgbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:rgba(6,14,20,.72);border:1px solid #2f4a58;border-radius:8px;padding:3px 6px}
.dmgbox small,.trigslot small{font-size:8px;letter-spacing:.08em;color:var(--mute)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{display:block;width:22px;aspect-ratio:63/88;border-radius:3px;border:1px dashed #416074}
.dmgbox .ch.sm{--cw:22px;width:22px}
.trigslot{width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(6,14,20,.72);border:1px dashed #416074;border-radius:8px;padding:2px}
.trigslot.on{border-style:solid;border-color:var(--warn)}.trigslot .ch.sm{--cw:30px;width:30px}
.side{gap:8px}
#pmid{padding:0}.tick{min-height:2.2em;font-size:11.5px}
#pinfo .tick{text-align:center}
#phand{--cw:clamp(44px,12vw,56px);gap:5px;background:linear-gradient(#0c1218,#080b10)}
#pmodal{background:linear-gradient(rgba(5,8,12,0),rgba(5,8,12,.6) 40%)}
.mbox{max-height:54dvh}.mc{width:84px}
@media(max-width:480px){.mat{padding:7px 7px}.mstrip{gap:3px}}

/* Dear Days Playmat Container */
.dd-mat{
 --mcw:min(clamp(56px,calc((100dvh - 380px)/4.6),92px),calc((100vw - 260px)/3.6));
 width:min(100%,860px);padding:8px 10px 9px;border-radius:16px;position:relative;
 background:var(--mat-me);border:1.5px solid var(--mat-bdr);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 0 40px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.55);
 display:flex;flex-direction:column;gap:6px;transition:transform .15s;
}
.dd-mat.opp{background:var(--mat-opp);border-color:var(--mat-bdr-opp)}
.dd-mat::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 9px)}
.dd-mat>*{position:relative;z-index:1}
.dd-mat.shake{animation:ddShake .42s ease-in-out}
@keyframes ddShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-.5deg)}38%{transform:translateX(6px) rotate(.5deg)}58%{transform:translateX(-4px)}78%{transform:translateX(3px)}}

/* Top HUD inside Mat */
.dd-hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.dd-hud .pbadge{font-weight:800;letter-spacing:.03em;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff}
.dd-mat.opp .dd-hud .pbadge{background:rgba(192,132,252,.22);color:#e9d5ff}
.dd-hud .statpill{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:1px 7px;color:#cbd5e1;font-variant-numeric:tabular-nums}
.dd-hud .stglow{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;font-weight:700;border-radius:99px;padding:1px 8px;box-shadow:0 0 10px rgba(245,158,11,.45)}
.dd-hud .stglow.cy{background:linear-gradient(90deg,#06b6d4,#6366f1);box-shadow:0 0 10px rgba(99,102,241,.45)}
.dd-hud .hb{padding:1px 7px;font-size:11px;border-radius:99px;background:rgba(245,176,65,.14);border:1px solid var(--warn);color:var(--warn)}

/* 3-Column Official Desktop Table */
.dd-grid{display:grid;grid-template-columns:126px 1fr 126px;gap:10px;align-items:center}
.dd-wing{display:flex;flex-direction:column;gap:5px;min-width:0}
.dd-center{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,14px);align-items:center}
.dd-mat .mrow3{display:grid;grid-template-columns:repeat(3,var(--mcw));gap:clamp(10px,2.4vw,24px);justify-content:center}

/* Magic Circle Cells with SVG Runes */
.dd-mat .cell{
 width:var(--mcw);aspect-ratio:63/88;position:relative;border-radius:9px;overflow:visible;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.42),rgba(0,0,0,.18));
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:box-shadow .18s,background .18s;
}
.dd-mat .cell::before,.dd-mat .cell::after{content:none!important}
.dd-mat .cell .rune{position:absolute;left:50%;top:50%;width:118%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.72;filter:drop-shadow(0 0 6px var(--rc,var(--ring-r)))}
.dd-mat .cell[data-circ=VC] .rune{--rc:var(--ring-v);opacity:.9;animation:ddSpin 36s linear infinite}
.dd-mat .cell.mk .rune{--rc:var(--ring-dt);opacity:1;filter:drop-shadow(0 0 10px var(--ring-dt))}
.dd-mat .cell.hl{background:rgba(79,209,197,.22);box-shadow:inset 0 0 0 2px var(--acc),0 0 20px rgba(79,209,197,.65);cursor:pointer}
.dd-mat .cell.hl .rune{--rc:var(--acc);opacity:1;animation:ddSpin 8s linear infinite}
@keyframes ddSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.dd-mat .cell .clbl{position:absolute;top:2px;left:5px;font-size:9px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.65);z-index:1;pointer-events:none;text-shadow:0 1px 3px #000}
.dd-mat .cell[data-circ=VC] .clbl{color:#ff8787}
.dd-mat .cell.mk .clbl{color:var(--ring-dt)}
.dd-mat .cell .ch{width:100%;position:relative;z-index:2;border-radius:7px;box-shadow:0 5px 14px rgba(0,0,0,.72);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.dd-mat .cell .ch.rest{transform:rotate(90deg) scale(.76);opacity:.93;filter:none}
.dd-mat .cell .ch.rest::after{content:none}
.dd-mat .cell .soulpill{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);z-index:4;padding:0 7px;height:16px;line-height:15px;font-size:9.5px;font-weight:700;border-radius:99px;background:#1e1633;border:1px solid #a78bfa;color:#e9d5ff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.7)}
.dd-mat .cell .soulpill:hover{border-color:#fff;color:#fff}

/* Battle Animations on Cards */
.dd-mat:not(.opp) .cell .ch.atk{transform:translateY(-10px) scale(1.06);box-shadow:0 10px 26px rgba(255,82,82,.75),0 0 0 2px #ff5252;z-index:5}
.dd-mat.opp .cell .ch.atk{transform:translateY(10px) scale(1.06);box-shadow:0 10px 26px rgba(255,82,82,.75),0 0 0 2px #ff5252;z-index:5}
.dd-mat .cell .ch.bst{box-shadow:0 0 18px rgba(245,176,65,.85),0 0 0 2px #f5b041;z-index:4}
.dd-mat .cell .ch.tgt{box-shadow:0 0 20px rgba(255,90,90,.9),0 0 0 2.5px #ff6b6b;animation:ddPulse .8s ease-in-out infinite}
@keyframes ddPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* Ornate Vanguard Card Back & Lock Seal */
.ch.down,.dd-back{
 background:
  radial-gradient(circle at 50% 50%,rgba(232,193,90,.28) 0%,rgba(232,193,90,.06) 32%,transparent 34%),
  repeating-conic-gradient(from 0deg at 50% 50%,rgba(232,193,90,.12) 0deg 15deg,transparent 15deg 30deg),

.ch.down.locked{

  radial-gradient(circle at 50% 50%,rgba(56,189,248,.35) 0%,transparent 48%),

}
.ch.down.locked b{color:#7dd3fc;border-color:#38bdf8}

/* Color-Coded Power & Critical Badges */
.ch .pw{position:absolute;right:0;bottom:0;left:0;text-align:right;padding:1px 4px;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.78) 28%,rgba(0,0,0,.9) 100%);color:#f8fafc;border-radius:0 0 6px 6px;text-shadow:0 1px 2px #000}
.ch .pw.up{color:#fde047;background:linear-gradient(90deg,transparent 0%,rgba(14,48,30,.88) 25%,rgba(8,28,18,.95) 100%);text-shadow:0 0 6px rgba(253,224,71,.7)}
.ch .pw.dn{color:#ff6b81;background:linear-gradient(90deg,transparent 0%,rgba(68,12,20,.9) 25%,rgba(42,6,12,.95) 100%)}

/* Wing Zone Cards (Desktop Official Layout) */

/* =====================  DEAR DAYS ARENA v11 OVERHAUL  ===================== */
#pboard{
 background:
  linear-gradient(180deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/100% 34px,

.phsep{color:rgba(255,255,255,.18);font-size:10px}
.phturn{

.phturn.opp{background:rgba(168,85,247,.25);border-color:rgba(192,132,252,.5);color:#f3e8ff}

/* Battle Clash VS Center Bar */
.dd-clash{
 width:min(100%,680px);margin:4px auto;padding:6px 14px;border-radius:12px;
 background:linear-gradient(90deg,rgba(185,28,28,.28) 0%,rgba(15,23,42,.94) 38%,rgba(15,23,42,.94) 62%,rgba(3,105,161,.28) 100%);

}
.dd-clash .cl-a{color:#fca5a5;font-weight:900;font-size:15px;text-shadow:0 0 10px rgba(239,68,68,.5)}
.dd-clash .cl-vs{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:900;font-size:11px;padding:2px 8px;border-radius:99px;letter-spacing:.1em}

.dd-clash .cl-res{font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px}
.dd-clash .cl-res.hit{background:rgba(239,68,68,.25);color:#fca5a5;border:1px solid #ef4444}
.dd-clash .cl-res.blk{background:rgba(56,189,248,.25);color:#7dd3fc;border:1px solid #38bdf8}

/* Center Divider Glow */
#pmid{position:relative;padding:2px 8px}
#pmid::before{content:"";display:block;width:min(94%,840px);height:1px;margin:0 auto 3px;
 background:linear-gradient(90deg,transparent,rgba(79,209,197,.45) 30%,rgba(251,191,36,.65) 50%,rgba(79,209,197,.45) 70%,transparent)}

/* Card-Proportioned Tabletop Zones (Dear Days Wings) */
.dd-mat{
 --mcw:min(clamp(58px,calc((100dvh - 405px)/4.5),92px),calc((100vw - 310px)/3.6));
 width:min(100%,920px);padding:8px 12px 10px;border-radius:18px;
}
.dd-grid{display:grid;grid-template-columns:156px 1fr 156px;gap:12px;align-items:center}
.dd-wing{display:flex;flex-direction:column;gap:7px;min-width:0}
.dd-zrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* Card Pedestal Slot (Actual 63:88 card aspect!) */
.dd-slot{
 position:relative;aspect-ratio:63/88;width:100%;padding:0;border-radius:8px;overflow:visible;
 background:radial-gradient(circle at 50% 45%,rgba(14,24,42,.86),rgba(5,9,18,.92));
 border:1.5px solid rgba(255,255,255,.16);color:var(--fg);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 transition:transform .14s,border-color .14s,box-shadow .14s;
}
.dd-slot:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 16px rgba(79,209,197,.28)}
.dd-slot .sl-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6.5px;z-index:0}
.dd-slot .sl-back{position:absolute;inset:0;border-radius:6.5px;z-index:0}
.dd-slot.stack .sl-back{box-shadow:2px 2px 0 #101b30,3px 3px 0 #c9a24b,5px 5px 0 #0a1020}
.dd-slot .sl-lbl{position:absolute;top:3px;left:3px;right:3px;z-index:2;text-align:center;font-size:8px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#e2e8f0;background:rgba(4,8,16,.76);border-radius:4px;padding:1px 2px;pointer-events:none}
.dd-slot .sl-cnt{position:absolute;bottom:3px;right:3px;z-index:2;min-width:20px;height:18px;line-height:18px;padding:0 5px;border-radius:99px;font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(4,8,16,.88);border:1px solid rgba(255,255,255,.28);color:#fff;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.7)}
.dd-slot .sl-empty{font-size:16px;opacity:.25;z-index:1}
.dd-slot.bind{border-color:rgba(192,132,252,.35)}
.dd-slot.trig{border-style:dashed;border-color:rgba(255,255,255,.22)}
.dd-slot.trig.on{border-style:solid;border-color:#fbbf24;box-shadow:0 0 18px rgba(251,191,36,.55)}
.dd-slot.crest{
 border-color:#fbbf24;background:linear-gradient(155deg,#2e1065 0%,#0f172a 55%,#451a03 100%);
 box-shadow:0 0 16px rgba(251,191,36,.42),inset 0 0 12px rgba(251,191,36,.2);

.dd-slot.crest .sl-em{font-size:24px;z-index:1;filter:drop-shadow(0 0 8px #fbbf24)}
.dd-slot.crest .sl-cname{font-size:8.5px;font-weight:800;color:#fde047;text-align:center;padding:0 3px;z-index:1;line-height:1.15;margin-top:2px}
.dd-slot.crest.ready{animation:ddCrestPulse 1.8s ease-in-out infinite}
@keyframes ddCrestPulse{0%,100%{box-shadow:0 0 14px rgba(251,191,36,.4)}50%{box-shadow:0 0 24px rgba(251,191,36,.9)}}

/* Enhanced Damage Tray */
.dd-dmg{background:rgba(5,10,20,.82);border:1px solid rgba(252,165,165,.28);border-radius:10px;padding:5px 6px}
.dd-dmglist{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dd-dmglist .ch.sm{width:100%;--cw:auto;aspect-ratio:63/88;border-radius:4px}
.dd-dmglist .pip{width:100%;aspect-ratio:63/88;border-radius:4px;border:1px dashed rgba(252,165,165,.24);background:rgba(255,255,255,.02)}

/* Grade-Modified Badge (e.g. Chronojet Crest G0!) */
.ch .grb{position:absolute;top:2px;left:2px;z-index:3;background:linear-gradient(135deg,#06b6d4,#2563eb);color:#fff;font-size:9px;font-weight:900;padding:0 4px;border-radius:4px;box-shadow:0 0 8px rgba(56,189,248,.8);border:1px solid rgba(255,255,255,.55)}
.ch .hgb{position:absolute;top:2px;left:2px;z-index:2;background:rgba(4,8,16,.82);color:#e2e8f0;font-size:9px;font-weight:800;padding:0 4px;border-radius:4px;border:1px solid rgba(255,255,255,.22);pointer-events:none}

/* Fanned & Interactive Hand (Dear Days Style) */
#phand{
 --cw:clamp(54px,11vw,72px);display:flex;align-items:flex-end;justify-content:safe center;
 gap:4px;overflow-x:auto;padding:14px 16px max(10px,env(safe-area-inset-bottom,0px));

}

}
#phand .ch:hover{transform:translateY(-10px) scale(1.06);z-index:5;box-shadow:0 12px 24px rgba(0,0,0,.85),0 0 0 1.5px rgba(79,209,197,.7)}
#phand .ch.sel{transform:translateY(-14px) scale(1.09);z-index:6;box-shadow:0 14px 28px rgba(79,209,197,.5),0 0 0 2.5px var(--acc)}

/* Sleek Action Dock Buttons */
#pact{padding:6px 12px;gap:6px}
#pact button{border-radius:99px;padding:6px 13px;font-weight:600;background:rgba(30,41,59,.88);border:1px solid rgba(148,163,184,.28);transition:all .15s}
#pact button:hover:not(:disabled){border-color:var(--acc);background:rgba(30,58,86,.95);transform:translateY(-1px)}
#pact button.big{background:linear-gradient(135deg,#2dd4bf,#0ea5e9);color:#041822;border:0;font-weight:800;box-shadow:0 4px 14px rgba(45,212,191,.38)}
#pact button.crestbtn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0b02;border:0;font-weight:800;box-shadow:0 4px 14px rgba(245,158,11,.42)}

.mc{border-radius:8px;transition:transform .12s,box-shadow .12s,border-color .12s}
.mc.on{box-shadow:0 0 14px rgba(79,209,197,.55);background:rgba(15,40,46,.95);transform:translateY(-2px)}
.mc.on::after{content:"✓";position:absolute;top:4px;right:4px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--acc);color:#04201c;font-weight:900;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.mc.dim{opacity:.42;filter:saturate(.4)}
.mc.match{border-color:#58d68d}

/* Crest Modal Card Preview */
.crest-card{
 max-width:440px;margin:0 auto;padding:14px;border-radius:14px;
 background:linear-gradient(155deg,#2e1065 0%,#0f172a 50%,#451a03 100%);

}

.crest-hd h3{margin:0;color:#fde047;font-size:16px}
.crest-hd small{color:#cbd5e1}
.crest-ab{background:rgba(0,0,0,.38);border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.crest-ab .en{color:var(--mute);font-size:11px}

/* 3D Drive / Damage Check Reveal Overlay */
#reveal{
 position:absolute;inset:0;z-index:24;
 background:radial-gradient(circle at 50% 48%,rgba(12,24,44,.78),rgba(3,6,12,.86));
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
 cursor:pointer;user-select:none;animation:rvFade .2s ease-out;
}
@keyframes rvFade{from{opacity:0}to{opacity:1}}
.rv-top{
 font-size:clamp(14px,3vw,20px);font-weight:900;letter-spacing:.18em;text-transform:uppercase;
 color:#7dd3fc;text-shadow:0 0 16px rgba(56,189,248,.85);
}
.rv-top.dmg{color:#fca5a5;text-shadow:0 0 16px rgba(239,68,68,.85)}
.rv-stage{perspective:1100px;width:clamp(155px,30vw,215px);aspect-ratio:63/88}
.rv-card{
 width:100%;height:100%;position:relative;transform-style:preserve-3d;
 transform:translateX(70px) scale(.75) rotateY(180deg);opacity:.35;
 transition:transform .52s cubic-bezier(.16,1,.3,1),opacity .25s;
}
.rv-card.in{transform:translateX(0) scale(1) rotateY(180deg);opacity:1}
.rv-card.flip{transform:translateX(0) scale(1.04) rotateY(0deg);opacity:1}
.rv-face{

 box-shadow:0 18px 46px rgba(0,0,0,.85);
}
.rv-back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center}
.rv-back span{font-size:13px;font-weight:900;letter-spacing:.2em;color:#f3d27a;background:rgba(6,10,20,.78);padding:4px 12px;border-radius:99px;border:1px solid rgba(232,193,90,.55)}
.rv-front{
 background:#111827;border:2px solid rgba(255,255,255,.35);display:flex;flex-direction:column;justify-content:flex-end;
}
.rv-front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rv-front .rv-txt{position:relative;z-index:1;padding:12px;background:linear-gradient(180deg,transparent,rgba(4,8,16,.92) 35%);color:#fff;font-size:12px}
.rv-card.trig-crit .rv-front{border-color:#fbbf24;box-shadow:0 0 42px rgba(251,191,36,.85)}
.rv-card.trig-front .rv-front{border-color:#f97316;box-shadow:0 0 42px rgba(249,115,22,.85)}
.rv-card.trig-draw .rv-front{border-color:#38bdf8;box-shadow:0 0 42px rgba(56,189,248,.85)}
.rv-card.trig-heal .rv-front{border-color:#4ade80;box-shadow:0 0 42px rgba(74,222,128,.85)}
.rv-card.trig-over .rv-front{border-color:#fde047;box-shadow:0 0 55px rgba(253,224,71,.98),0 0 28px rgba(192,132,252,.85)}
.rv-res{
 min-height:46px;display:flex;flex-direction:column;align-items:center;gap:2px;
 opacity:0;transform:translateY(8px);transition:all .26s ease-out;
}
.rv-res.on{opacity:1;transform:translateY(0)}
.rv-res .rv-badge{
 font-size:clamp(18px,4vw,28px);font-weight:900;letter-spacing:.1em;padding:3px 18px;border-radius:99px;
 background:rgba(15,23,42,.88);border:1.5px solid rgba(255,255,255,.25);color:#cbd5e1;

.rv-res .rv-badge.trig{
 background:linear-gradient(90deg,#b45309,#f59e0b,#b45309);border-color:#fef08a;color:#fff;

}
.rv-res .rv-badge.over{
 background:linear-gradient(90deg,#6d28d9,#d97706,#db2777);border-color:#fef08a;color:#fff;

}
.rv-res .rv-sub{font-size:13px;color:#e2e8f0;font-weight:600;text-shadow:0 1px 4px #000}
.rv-skip{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}

@media(max-width:739px){
 .dd-grid{display:flex;flex-direction:column;gap:6px}
 .dd-wing{display:none}
 .dd-mobstrip{display:flex;flex-direction:column;gap:5px;width:100%}

}

#pgame{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#parena{
 flex:1;min-height:0;display:grid;grid-template-columns:224px minmax(0,1fr) 244px;
 gap:10px;padding:6px 12px 4px;overflow:hidden;
}

/* Left & Right Sidebars */
#arLeft,#arRight{
 min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;
}

/* Turn & Phase Big Emblem (Top Left) */
.ar-turnbox{
 padding:10px 14px;border-radius:8px;
 background:linear-gradient(135deg,rgba(15,32,62,.92),rgba(9,16,32,.95));
 border:1.5px solid rgba(59,130,246,.55);border-left:4px solid #38bdf8;
 box-shadow:0 6px 20px rgba(0,0,0,.45);
}
.ar-turnbox.opp{
 background:linear-gradient(135deg,rgba(62,15,28,.92),rgba(24,9,18,.95));
 border-color:rgba(239,68,68,.55);border-left-color:#ef4444;
}
.ar-turnbox .tb-top{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#93c5fd;display:flex;align-items:baseline;gap:6px}
.ar-turnbox.opp .tb-top{color:#fca5a5}
.ar-turnbox .tb-top b{font-size:15px;color:#fff}
.ar-turnbox .tb-ph{font-size:26px;font-weight:900;font-style:italic;letter-spacing:.06em;line-height:1.05;color:#fff;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}

/* Left Rail Live Card Preview / Skill Toast */
#arCardInfo{
 flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;
}
.ar-cinfo{
 background:rgba(15,23,42,.92);border:1px solid rgba(148,163,184,.25);border-radius:10px;
 padding:9px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.ar-cinfo-hd{display:flex;gap:8px;align-items:flex-start}
.ar-cinfo-hd img{width:54px;aspect-ratio:63/88;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.22);flex:0 0 auto;cursor:zoom-in}
.ar-cinfo-meta{min-width:0;flex:1}
.ar-cinfo-meta b{font-size:12.5px;line-height:1.2;display:block;color:#f8fafc}
.ar-cinfo-meta small{font-size:10.5px;color:#94a3b8;display:block;margin-top:2px}
.ar-cinfo-st{display:flex;gap:8px;font-size:11px;font-weight:700;color:#e2e8f0;margin-top:3px;font-variant-numeric:tabular-nums}
.ar-cinfo-tx{font-size:10.8px;line-height:1.35;color:#cbd5e1;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:5px}
.ab-tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:9.5px;font-weight:900;letter-spacing:.04em;margin-right:4px;color:#fff}
.ab-tag.auto{background:#059669}.ab-tag.cont{background:#dc2626}.ab-tag.act{background:#2563eb}

/* Player & Opponent HUD Panels (Bottom-Left & Top-Right) */
.ar-hud{
 padding:9px 11px;border-radius:8px;background:rgba(12,20,36,.92);
 border:1.5px solid rgba(59,130,246,.5);box-shadow:0 6px 18px rgba(0,0,0,.45);
 display:flex;flex-direction:column;gap:4px;
}
.ar-hud.opp{background:rgba(36,12,22,.9);border-color:rgba(239,68,68,.55)}
.ar-hud-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ar-hud-top b{font-size:13.5px;color:#60a5fa}
.ar-hud.opp .ar-hud-top b{color:#f87171}
.ar-hud-top .tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.1);color:#e2e8f0;font-weight:700}
.ar-hud-stats{display:flex;gap:8px;font-size:10.5px;font-weight:700;color:#cbd5e1;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ar-hud-stats span b{color:#fff;font-size:12px}
.ar-hud-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ar-hud-badges .stglow{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:800;color:#fff;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.ar-hud-badges .stglow.cy{background:linear-gradient(90deg,#0284c7,#6366f1)}
.ar-hud-badges .hb{font-size:10px;padding:1px 7px;border-radius:99px;background:rgba(245,176,65,.16);border:1px solid #f5b041;color:#fde047}

/* Opponent Mini Hand Backs (Right Rail under Opp HUD) */
.ar-opphand{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:2px 2px}
.ar-opphand .oh-cards{display:flex;margin-right:4px}
.ar-opphand .oh-c{width:17px;height:25px;border-radius:3px;margin-left:-7px;border:1px solid #c9a24b;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.ar-opphand .oh-c:first-child{margin-left:0}
.ar-opphand small{font-size:10.5px;color:#94a3b8;font-weight:700}

/* Right Rail Action Feed Cards */
#arFeed{
 flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px;
}
.ar-feed-item{
 display:flex;gap:7px;align-items:center;padding:6px 8px;border-radius:7px;
 background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.18);
 font-size:11px;line-height:1.25;color:#e2e8f0;animation:rvFade .2s ease-out;
}
.ar-feed-item.opp{border-left:3px solid #ef4444}
.ar-feed-item.me{border-left:3px solid #38bdf8}
.ar-feed-item img{width:24px;aspect-ratio:63/88;border-radius:3px;object-fit:cover;flex:0 0 auto}
.ar-feed-item .fi-b{min-width:0;flex:1}
.ar-feed-item small{display:block;font-size:9px;color:#94a3b8;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* Right Rail Action Dock (#arCtrl) */
#arCtrl{
 display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px solid rgba(255,255,255,.08);
}
#arCtrl .ctrl-hint{font-size:11px;color:#94a3b8;text-align:right;line-height:1.3}
#arCtrl .ctrl-btns{display:flex;flex-direction:column;gap:5px}
#arCtrl button{
 width:100%;padding:8px 10px;border-radius:8px;font-weight:700;font-size:12.5px;
 background:rgba(30,41,59,.92);border:1px solid rgba(148,163,184,.28);color:#f8fafc;
 transition:all .15s;
}
#arCtrl button:hover:not(:disabled){border-color:#38bdf8;background:rgba(30,58,86,.95)}
#arCtrl button.primary{
 background:linear-gradient(135deg,#2dd4bf,#0ea5e9);color:#04151f;border:0;font-weight:900;
 padding:10px 12px;font-size:13.5px;box-shadow:0 4px 16px rgba(45,212,191,.35);
}
#arCtrl button.crestbtn{
 background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a0b02;border:0;font-weight:800;
}
#arCtrl .ctrl-row{display:flex;gap:5px}
#arCtrl .ctrl-row button{flex:1;padding:6px 6px;font-size:11.5px}

/* Center Tabletop Board: 2 Crisp Playmats Stacked Flush */
#arCenter{
 min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:4px;overflow:hidden;position:relative;
}
#pboard{
 width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:3px;overflow:hidden;background:transparent!important;position:relative;
}
.side{padding:0!important;width:100%;display:flex;flex-direction:column;align-items:center;gap:0!important}
#pmid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:min(94%,640px);pointer-events:none;padding:0!important}
#pmid::before{display:none!important}
#pmid>*{pointer-events:auto}

/* Twin Rectangular Playmats (Exact Viewport Fit!) */
.ar-mat{
 --cw-f:clamp(46px,min(calc((100dvh - 196px)/5.45),calc((100vw - 560px)/7.8)),82px);
 width:min(100%,calc(var(--cw-f) * 8.2));
 padding:7px 10px;border-radius:12px;position:relative;overflow:hidden;
 background:var(--mat-me);background-size:cover;background-position:center;
 border:1.5px solid var(--mat-bdr);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.6);
}
.ar-mat.opp{background:var(--mat-opp);background-size:cover;background-position:center;border-color:var(--mat-bdr-opp)}
.ar-mat.has-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,18,.22),rgba(6,10,18,.34));pointer-events:none;z-index:0}
.ar-mat.shake{animation:ddShake .42s ease-in-out}
.ar-mgrid{
 position:relative;z-index:1;
 display:grid;grid-template-columns:calc(var(--cw-f)*1.38) 1fr calc(var(--cw-f)*1.24);
 gap:10px;align-items:center;
}
.ar-mat.opp .ar-mgrid{grid-template-columns:calc(var(--cw-f)*1.24) 1fr calc(var(--cw-f)*1.38)}

/* Center 2x3 Magic Circles */
.ar-circles{display:flex;flex-direction:column;gap:8px;align-items:center}
.ar-crow{display:grid;grid-template-columns:repeat(3,var(--cw-f));gap:clamp(12px,2.2vw,28px);justify-content:center}
.ar-mat .cell{
 width:var(--cw-f);aspect-ratio:63/88;position:relative;border-radius:7px;overflow:visible;
 display:flex;align-items:center;justify-content:center;
 background:rgba(4,8,16,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
}
.ar-mat .cell::before,.ar-mat .cell::after{content:none!important}
.ar-mat .cell .rune{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.78;filter:drop-shadow(0 0 6px var(--rc,var(--ring-r)))}
.ar-mat .cell[data-circ=VC] .rune{--rc:var(--ring-v);opacity:.95;animation:ddSpin 34s linear infinite}
.ar-mat .cell.mk .rune{--rc:var(--ring-dt);opacity:1}
.ar-mat .cell.hl{background:rgba(56,189,248,.28);box-shadow:inset 0 0 0 2px #38bdf8,0 0 20px rgba(56,189,248,.75);cursor:pointer}
.ar-mat .cell.hl .rune{--rc:#38bdf8;opacity:1;animation:ddSpin 6s linear infinite}
.ar-mat .cell .clbl{position:absolute;font-size:12px;font-weight:900;color:rgba(255,255,255,.45);z-index:1;pointer-events:none;text-shadow:0 1px 4px #000}
.ar-mat .cell[data-circ=VC] .clbl{color:rgba(255,130,130,.75)}
.ar-mat .cell .ch{width:100%;height:100%;position:relative;z-index:2;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.78);transition:transform .18s}

/* Authentic Vanguard Rest Rotation (90deg clockwise) */
.ar-mat .cell .ch.rest{transform:rotate(90deg) scale(.86)!important;opacity:.92!important;filter:brightness(.88)}
.ar-mat.opp .cell .ch.rest{transform:rotate(-90deg) scale(.86)!important}
.ar-mat .cell .ch.rest::after{content:none!important;display:none!important}

/* Floating Power + Crit Pill & Soul Pill */
.ar-statpill{
 position:absolute;left:50%;transform:translateX(-50%);z-index:6;
 bottom:-9px;padding:1px 6px;border-radius:5px;white-space:nowrap;
 background:rgba(7,13,24,.94);border:1px solid rgba(148,163,184,.55);
 color:#f8fafc;font-size:10px;font-weight:900;font-variant-numeric:tabular-nums;
 box-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;display:flex;align-items:center;gap:4px;
}
.ar-mat.opp .ar-statpill{bottom:auto;top:-9px}
.ar-statpill.up{border-color:#fbbf24;color:#fde047;background:rgba(18,38,24,.96)}
.ar-statpill.dn{border-color:#f87171;color:#fca5a5;background:rgba(52,12,18,.96)}
.ar-statpill .st-cr{color:#fbbf24}
.ar-statpill .st-g{background:#0284c7;color:#fff;padding:0 3px;border-radius:3px;font-size:8.5px}
.ar-soulpill{
 position:absolute;right:-38px;bottom:2px;z-index:6;
 padding:1px 6px;border-radius:4px;font-size:9px;font-weight:800;white-space:nowrap;
 background:rgba(12,18,32,.92);border:1px solid rgba(148,163,184,.45);color:#e2e8f0;
 box-shadow:0 2px 6px rgba(0,0,0,.75);
}
.ar-mat.opp .ar-soulpill{right:auto;left:-38px;bottom:auto;top:2px}
.ar-soulpill:hover{border-color:#38bdf8;color:#fff}

/* Battle Animations */
.ar-mat:not(.opp) .cell .ch.atk{transform:translateY(-8px) scale(1.05)!important;box-shadow:0 10px 26px rgba(239,68,68,.8),0 0 0 2px #ef4444;z-index:7}
.ar-mat.opp .cell .ch.atk{transform:translateY(8px) scale(1.05)!important;box-shadow:0 10px 26px rgba(239,68,68,.8),0 0 0 2px #ef4444;z-index:7}
.ar-mat .cell .ch.bst{box-shadow:0 0 18px rgba(251,191,36,.9),0 0 0 2px #fbbf24;z-index:5}
.ar-mat .cell .ch.tgt{box-shadow:0 0 20px rgba(239,68,68,.95),0 0 0 2.5px #ef4444;animation:ddPulse .8s ease-in-out infinite}

/* Horizontal Overlapping Damage Stack (Authentic Vanguard Playmat!) */
.ar-dmgcol{
 display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;
}
.ar-dmgstack{
 width:100%;display:flex;flex-direction:column;align-items:center;
}
.ar-dmgitem{
 width:92%;height:clamp(22px,calc(var(--cw-f)*0.34),31px);border-radius:4px;position:relative;
 border:1px solid rgba(255,255,255,.22);background:rgba(15,23,42,.52);
 overflow:hidden;cursor:pointer;margin-top:-4px;box-shadow:0 2px 6px rgba(0,0,0,.55);
 transition:transform .14s;
}
.ar-dmgitem:first-child{margin-top:0}
.ar-dmgitem.filled:hover{transform:translateX(4px) scale(1.04);z-index:5;border-color:#38bdf8}
.ar-dmgitem img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
.ar-dmgitem.down{border-color:#c9a24b}
.ar-dmgitem .cb-tag{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:8px;font-weight:900;background:rgba(4,8,16,.84);color:#fde047;padding:0 4px;border-radius:3px}
.ar-zpill{
 font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:4px;
 background:rgba(5,10,20,.88);border:1px solid rgba(255,255,255,.22);color:#e2e8f0;white-space:nowrap;
}

/* Deck + Drop Stack Column & D-Series Micro-Pills */
.ar-pilecol{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.ar-pile{
 position:relative;width:calc(var(--cw-f)*0.9);aspect-ratio:63/88;padding:0;border-radius:6px;
 border:1.5px solid rgba(255,255,255,.22);background:rgba(10,16,28,.65);
 overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .14s;
}
.ar-pile:hover{border-color:#38bdf8;transform:translateY(-2px)}
.ar-pile.stack{box-shadow:2px 2px 0 #0c1424,3px 3px 0 #c9a24b}
.ar-pile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar-pile .pl-lbl{position:absolute;bottom:2px;left:2px;right:2px;z-index:2;text-align:center;font-size:8.5px;font-weight:900;background:rgba(4,8,16,.86);color:#f8fafc;border-radius:3px;padding:1px 2px;letter-spacing:.04em}
.ar-minizones{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;width:100%;margin-top:2px}
.ar-mz{
 font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:4px;
 background:rgba(6,12,24,.88);border:1px solid rgba(148,163,184,.3);color:#cbd5e1;
}
.ar-mz:hover{border-color:#38bdf8;color:#fff}
.ar-mz.crest{border-color:#fbbf24;color:#fde047;background:rgba(69,26,3,.88)}
.ar-mz.crest.ready{animation:ddCrestPulse 1.6s ease-in-out infinite}

/* Custom Sleeve Back Override */
.has-sleeve .dd-back,.has-sleeve .sl-back,.has-sleeve .ch.down:not(.locked){
 background-image:var(--sleeve-url)!important;background-size:cover!important;background-position:center!important;
}

/* Bottom Hand Dock (Full-Art Peeking Strip!) */
#phand-wrap{
 flex:0 0 auto;position:relative;display:flex;align-items:flex-end;justify-content:center;
 background:linear-gradient(180deg,rgba(8,14,26,.45),rgba(4,8,15,.98));
 border-top:1px solid rgba(148,163,184,.16);padding:4px 14px max(6px,env(safe-area-inset-bottom,0px));
}
#phand{
 --cw:clamp(54px,7.2vw,76px);display:flex;align-items:flex-end;justify-content:safe center;
 gap:5px;overflow-x:auto;padding:10px 8px 2px!important;min-height:calc(var(--cw)*1.38 + 14px)!important;
 background:transparent!important;border:0!important;flex:1;
}
#phand .ch{box-shadow:0 4px 14px rgba(0,0,0,.85);border-radius:6px;transition:transform .16s cubic-bezier(.2,.9,.3,1)}
#phand .ch:hover{transform:translateY(-12px) scale(1.08);z-index:6}
#phand .ch.sel{transform:translateY(-16px) scale(1.1);z-index:7;box-shadow:0 12px 26px rgba(56,189,248,.6),0 0 0 2.5px #38bdf8}
#phand-cnt{position:absolute;right:14px;bottom:8px;font-size:11px;font-weight:800;color:#94a3b8;pointer-events:none}

/* Phase Sweep Banner (Center Glass Strip like Screenshot 2!) */
#pbanner{
 position:absolute;inset:0;z-index:22;pointer-events:none;
 display:flex;align-items:center;justify-content:center;
}
.pb-strip{
 width:min(740px,96%);padding:16px 24px;text-align:center;
 background:linear-gradient(90deg,transparent 0%,rgba(8,13,24,.9) 18%,rgba(12,20,38,.94) 50%,rgba(8,13,24,.9) 82%,transparent 100%);
 border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25);
 animation:pbAnim .88s cubic-bezier(.16,1,.3,1) forwards;
}
.pb-strip small{display:block;font-size:11.5px;color:#cbd5e1;letter-spacing:.1em;margin-bottom:2px}
.pb-strip b{display:block;font-size:clamp(24px,4.5vw,38px);font-weight:900;font-style:italic;letter-spacing:.12em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85)}
@keyframes pbAnim{
 0%{opacity:0;transform:scale(.95)}18%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}
}

/* Right-Side Angled Drive / Damage Check Reveal (Screenshots 6 & 9!) */
#reveal{
 position:absolute;inset:auto 16px 104px auto!important;width:238px!important;height:auto!important;
 background:transparent!important;pointer-events:auto;z-index:24;
 display:flex;flex-direction:column;align-items:center;gap:8px;
}
.rv-top{
 width:100%;text-align:center;font-size:11px!important;font-weight:900;letter-spacing:.12em;
 padding:4px 10px;border-radius:4px;background:rgba(7,12,22,.92);
 border:1px solid rgba(255,255,255,.28);color:#f8fafc!important;
 transform:rotate(-4deg);box-shadow:0 4px 14px rgba(0,0,0,.7);
}
.rv-top.dmg{border-color:rgba(239,68,68,.7);color:#fca5a5!important}
.rv-stage{width:176px!important;transform:rotate(-4deg)}
.rv-res .rv-badge{font-size:16px!important;padding:3px 12px!important}
.rv-res .rv-sub{font-size:11px!important;background:rgba(7,12,22,.88);padding:2px 8px;border-radius:6px}

/* Arena Guard Modal & Peek Board Pill (Screenshot 8!) */
.gd-vs{
 display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;
 background:rgba(8,14,26,.72);border-radius:10px;border:1px solid rgba(148,163,184,.2);
}
.gd-side{display:flex;align-items:center;gap:8px}
.gd-side img{width:46px;aspect-ratio:63/88;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.25)}
.gd-num{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.gd-zone{
 border:1.5px dashed rgba(148,163,184,.38);border-radius:10px;padding:10px;
 background:rgba(6,10,20,.55);display:flex;flex-direction:column;gap:6px;
}
.gd-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gd-acts button{padding:10px;border-radius:8px;font-weight:800;font-size:13.5px}
.gd-acts .btn-coral{background:var(--ar-coral);color:#1a0705;border:0}
.gd-peekbtn{width:100%;padding:8px;border-radius:8px;background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.28);color:#cbd5e1;font-weight:700}
#gdResume{
 position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:26;
 padding:10px 22px;border-radius:99px;background:var(--ar-coral);color:#1a0705;border:0;
 font-weight:900;font-size:14px;box-shadow:0 8px 26px rgba(242,118,107,.55);
}

/* Coin Flip Modal (Screenshot 1!) */
.coin-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 6px;text-align:center}
.coin-disc{
 width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:28px;font-weight:900;color:#451a03;
 background:radial-gradient(circle at 35% 30%,#fef08a,#d97706 72%,#78350f);
 border:4px solid #fde047;box-shadow:0 0 28px rgba(251,191,36,.45),inset 0 0 12px rgba(255,255,255,.4);
 transition:transform .9s cubic-bezier(.2,.8,.2,1);
}
.coin-disc.spin{transform:rotateY(1080deg) scale(1.08)}
.btn-coral{background:var(--ar-coral);color:#1a0705;border:0;font-weight:800;padding:10px 24px;border-radius:10px}

/* Center Modal Override for Sleek Arena Dialogs */
#pmodal{z-index:20!important;align-items:center!important;background:rgba(4,8,16,.66)!important;backdrop-filter:blur(2px)}
.mbox{

/* =====================  OFFICIAL PLAYMAT v13 (PIXEL-ALIGNED)  ===================== */
#phand-wrap{
 padding:2px 14px max(4px,env(safe-area-inset-bottom,0px))!important;
}
#phand{

}

#phand .ch:hover{transform:translateY(-16px) scale(1.09)!important}

.ar-mat{
 aspect-ratio:1024/521;
 width:min(100%,calc((100dvh - 138px) * 0.982))!important;
 height:auto!important;padding:0!important;border-radius:10px;
 position:relative;overflow:hidden;
 background:#14161b;border:1.5px solid rgba(148,163,184,.34);
 box-shadow:0 8px 26px rgba(0,0,0,.68);
}
.ar-mat::before{
 content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
 background-image:var(--mat-img);background-size:100% 100%;background-position:center;
}
.ar-mat.opp.def-mat::before{transform:rotate(180deg)}
.ar-mat.has-bg::after{
 content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(6,10,18,.16),rgba(6,10,18,.26));
}

/* Absolute Percentage Playmat Coordinate Layer */
.ar-layer{position:absolute;inset:0;z-index:1}

/* Magic Circle Slots (Exact Printed Circle Centers!) */
.ar-layer .cell{
 position:absolute!important;width:11.6%!important;height:33.2%!important;
 min-height:0!important;aspect-ratio:auto!important;
 transform:translate(-50%,-50%);border-radius:6px;overflow:visible;
 background:transparent;box-shadow:none;border:0;
 display:flex;align-items:center;justify-content:center;
 transition:box-shadow .16s,background .16s;
}
.ar-mat.def-mat .ar-layer .cell .rune,
.ar-mat.def-mat .ar-layer .cell .clbl{display:none}
.ar-mat.def-mat .ar-layer .cell.mk{

 background:rgba(52,232,158,.14);
}
.ar-mat.def-mat .ar-layer .cell.mk::after{
 content:"DT"!important;position:absolute;top:-8px;right:-6px;z-index:7;
 background:#059669;color:#fff;font-size:8px;font-weight:900;padding:0 4px;border-radius:4px;
 box-shadow:0 0 8px #34e89e;
}
.ar-layer .cell.hl{
 background:rgba(56,189,248,.28)!important;
 box-shadow:0 0 0 2.5px #38bdf8,0 0 22px rgba(56,189,248,.9)!important;

}
.ar-layer .cell .ch{
 width:100%;height:100%;aspect-ratio:auto;border-radius:5px;
 box-shadow:0 4px 14px rgba(0,0,0,.82);
}

/* Exact Player (s=0) Circle Coordinates */

.ar-mat:not(.opp) .cell[data-circ="VC"]{left:49.98%;top:39.80%}
.ar-mat:not(.opp) .cell[data-circ="FR"]{left:69.56%;top:39.55%}
.ar-mat:not(.opp) .cell[data-circ="BL"]{left:30.33%;top:80.04%}
.ar-mat:not(.opp) .cell[data-circ="BC"]{left:49.89%;top:80.07%}
.ar-mat:not(.opp) .cell[data-circ="BR"]{left:69.54%;top:79.97%}

/* Exact Opponent (s=1) Mirrored Circle Coordinates (180deg flip) */
.ar-mat.opp .cell[data-circ="FR"]{left:30.44%;top:60.45%}
.ar-mat.opp .cell[data-circ="VC"]{left:50.02%;top:60.20%}
.ar-mat.opp .cell[data-circ="FL"]{left:69.66%;top:60.34%}
.ar-mat.opp .cell[data-circ="BR"]{left:30.46%;top:20.03%}
.ar-mat.opp .cell[data-circ="BC"]{left:50.11%;top:19.93%}
.ar-mat.opp .cell[data-circ="BL"]{left:69.67%;top:19.96%}

/* Power + Crit Pill & Soul Pill */

}
.ar-mat.opp .ar-statpill{bottom:auto;top:-10px}

.ar-slot-tl{

.ar-slot-tl .pl-lbl{position:absolute;bottom:2px;left:2px;right:2px;z-index:2;text-align:center;font-size:clamp(7.5px,.85vw,9px);font-weight:900;background:rgba(4,8,16,.84);color:#f8fafc;border-radius:3px;padding:1px}

/* Exact Printed Deck & Drop Zones */
.ar-slot-deck{
 position:absolute;left:83.40%;top:26.87%;width:10.64%;height:30.52%;padding:0;
 border-radius:5px;border:1px solid rgba(255,255,255,.22);background:rgba(8,12,20,.22);

}
.ar-slot-drop{

 overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .14s;
}
.ar-mat.opp .ar-slot-deck{left:5.96%;top:42.61%}
.ar-mat.opp .ar-slot-drop{left:5.96%;top:7.10%}
.ar-slot-deck:hover,.ar-slot-drop:hover{border-color:#38bdf8;transform:scale(1.03)}
.ar-slot-deck.stack{box-shadow:2px 2px 0 #0c1424,3px 3px 0 #c9a24b}
.ar-slot-deck img,.ar-slot-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar-slot-deck .pl-lbl,.ar-slot-drop .pl-lbl{position:absolute;bottom:2px;left:2px;right:2px;z-index:2;text-align:center;font-size:clamp(7.5px,.85vw,9px);font-weight:900;background:rgba(4,8,16,.86);color:#f8fafc;border-radius:3px;padding:1px}

/* Exact Printed 6-Tier Damage Zone Overlay (Horizontal Landscape Cards) */
.ar-slot-dmg{
 position:absolute;left:5.18%;top:46.6%;width:15.53%;height:50.5%;
 display:block;padding:0;overflow:visible;
}
.ar-mat.opp .ar-slot-dmg{left:79.29%;top:2.9%}
.ar-slot-dmg .ar-dmgitem{
 position:absolute;left:0;width:100%;aspect-ratio:88/63;height:auto!important;

.ar-slot-dmg .ar-dmgitem.filled{

}

}
.ar-slot-dmg .ar-dmgitem img{
 position:absolute;left:50%;top:50%;
 width:71.6%;height:139.7%;
 object-fit:cover;object-position:center;
 transform:translate(-50%,-50%) rotate(90deg);
}
.ar-mat.opp .ar-slot-dmg .ar-dmgitem img{
 transform:translate(-50%,-50%) rotate(-90deg);
}
.ar-dmg-badge{

 border:1px solid rgba(255,255,255,.26);color:#f8fafc;
}
.ar-mat.opp .ar-dmg-badge{left:auto;right:5.18%;top:54.5%}

/* D-Series Micro Zone Dock (Order / Bind / G-Zone / Crest / Prison) */
.ar-dzone{

}

.ar-dzone .ar-mz{
 width:100%;text-align:center;font-size:clamp(7.5px,.82vw,9px);padding:2px 3px;

.ar-dzone .ar-mz:hover{border-color:#38bdf8;color:#fff}

.ar-dzone .ar-mz.mk{border-color:#34d399;color:#6ee7b7;background:rgba(6,78,59,.92);font-weight:900}

/* =====================  ANIME FX, SCRY UI & DIGITAL FIGHT SPACE (v14)  ===================== */

/* 1. Dynamic Arena Aura (Masques / RevolDress / Stride / Final Rush) */
#play::after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;
 transition:opacity .55s ease,box-shadow .55s ease;
}
#play[data-aura="masques"]::after{
 opacity:1;
 background:radial-gradient(ellipse at 50% 50%,transparent 48%,rgba(153,27,27,.26) 84%,rgba(88,28,135,.42) 100%);
 box-shadow:inset 0 0 90px rgba(220,38,38,.42);
 animation:auraBreath 3.2s ease-in-out infinite;
}
#play[data-aura="revol"]::after{
 opacity:1;
 background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(14,165,233,.24) 86%,rgba(37,99,235,.42) 100%);
 box-shadow:inset 0 0 90px rgba(56,189,248,.48);
 animation:auraBreath 2.2s ease-in-out infinite;
}
#play[data-aura="stride"]::after{
 opacity:1;
 background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(168,85,247,.22) 84%,rgba(234,179,8,.34) 100%);
 box-shadow:inset 0 0 90px rgba(192,132,252,.42);
 animation:auraBreath 2.8s ease-in-out infinite;
}
#play[data-aura="final"]::after{
 opacity:1;
 background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(126,34,206,.24) 84%,rgba(219,39,119,.34) 100%);
 box-shadow:inset 0 0 85px rgba(192,132,252,.4);
 animation:auraBreath 2.6s ease-in-out infinite;
}
@keyframes auraBreath{0%,100%{opacity:.72}50%{opacity:1}}

/* 2. Digital Fight Space Theme (Uniformers Cyber Grid) */
#play[data-theme="digital"]{
 background:
  linear-gradient(180deg,rgba(56,189,248,.055) 1px,transparent 1px) 0 0/100% 28px,
  linear-gradient(90deg,rgba(56,189,248,.055) 1px,transparent 1px) 0 0/28px 100%,
  radial-gradient(ellipse at 50% 50%,#071b2f 0%,#030b16 68%,#010409 100%)!important;
 --ring-v:#38bdf8;--ring-r:#22d3ee;--ring-dt:#34d399;
}
#play[data-theme="digital"] .ar-mat.cyber-mat{
 background:
  linear-gradient(180deg,rgba(56,189,248,.11) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,rgba(56,189,248,.11) 1px,transparent 1px) 0 0/24px 100%,
  radial-gradient(120% 95% at 50% 25%,rgba(14,116,144,.34),rgba(4,12,24,.96) 72%)!important;
 border:1.5px solid rgba(56,189,248,.7)!important;
 box-shadow:0 0 28px rgba(56,189,248,.22),inset 0 0 36px rgba(14,165,233,.16)!important;
}
#play[data-theme="digital"] .ar-mat.opp.cyber-mat{
 background:
  linear-gradient(180deg,rgba(244,63,94,.09) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,rgba(244,63,94,.09) 1px,transparent 1px) 0 0/24px 100%,
  radial-gradient(120% 95% at 50% 75%,rgba(136,19,55,.32),rgba(12,6,18,.96) 72%)!important;
 border-color:rgba(244,63,94,.65)!important;
 box-shadow:0 0 28px rgba(244,63,94,.2),inset 0 0 36px rgba(244,63,94,.14)!important;
 --ring-v:#fb7185;--ring-r:#f472b6;
}
#play[data-theme="digital"] .ar-mat.cyber-mat::before{background-image:none!important}
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-layer .cell .rune,
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-layer .cell .clbl{display:block!important}
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-slot-tl,
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-slot-deck,
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-slot-drop{
 border-color:rgba(56,189,248,.55);background:rgba(4,16,32,.65);box-shadow:inset 0 0 12px rgba(56,189,248,.18);
}
#play[data-theme="digital"] .ar-mat.cyber-mat .ar-slot-dmg{
 border:1px dashed rgba(56,189,248,.45);border-radius:6px;background:rgba(4,16,32,.42);padding:2px;
}

/* 3. Stand Up Vanguard Opening Flip */
.vg-standup{animation:vgStandUp .78s cubic-bezier(.16,1,.3,1)}
@keyframes vgStandUp{
 0%{transform:rotateY(180deg) scale(.86);filter:brightness(1.8)}
 55%{transform:rotateY(0deg) scale(1.14);filter:brightness(1.35);box-shadow:0 0 34px rgba(251,191,36,.95)}
 100%{transform:rotateY(0deg) scale(1);filter:brightness(1)}
}

/* 4. Cell Action FX Bursts (Retire / Remove / Soul / Marker / Swap / Drop-to-1) */
.fx-burst{
 position:absolute;inset:-14%;z-index:18;pointer-events:none;border-radius:10px;
}
.fx-burst.fx-retire{
 background:radial-gradient(circle,rgba(251,146,60,.92) 0%,rgba(220,38,38,.72) 45%,transparent 72%);
 animation:fxBoom .52s ease-out forwards;
}
.fx-burst.fx-remove{
 background:radial-gradient(circle,rgba(232,121,249,.9) 0%,rgba(153,27,27,.78) 48%,transparent 74%);
 animation:fxDissolve .62s ease-out forwards;
}
.fx-burst.fx-soul{
 border:2px solid #c084fc;
 background:radial-gradient(circle,rgba(168,85,247,.7) 0%,rgba(99,102,241,.25) 55%,transparent 75%);
 animation:fxVortex .55s ease-out forwards;
}
.fx-burst.fx-marker{
 border:2px solid #34d399;
 background:radial-gradient(circle,rgba(52,211,153,.72) 0%,rgba(5,150,105,.25) 58%,transparent 76%);
 animation:fxBoom .6s ease-out forwards;
}
.fx-burst.fx-swap{
 border:2px solid #38bdf8;background:rgba(56,189,248,.22);
 animation:fxBoom .4s ease-out forwards;
}
.fx-burst.fx-drop1{
 border:2.5px solid #ef4444;
 background:radial-gradient(circle,rgba(239,68,68,.78) 0%,rgba(127,29,29,.45) 58%,transparent 78%);
 animation:fxBoom .68s ease-out forwards;
}
@keyframes fxBoom{
 0%{opacity:0;transform:scale(.55)}
 30%{opacity:1;transform:scale(1.18)}
 100%{opacity:0;transform:scale(1.42)}
}
@keyframes fxDissolve{
 0%{opacity:1;transform:scale(1) rotate(0deg);filter:blur(0)}
 100%{opacity:0;transform:scale(1.38) translateY(-18px) rotate(12deg);filter:blur(5px)}
}
@keyframes fxVortex{
 0%{opacity:.95;transform:scale(1.35) rotate(0deg)}
 100%{opacity:0;transform:scale(.4) rotate(180deg)}
}

/* 5. Rolling Power Counter Pop */
.ar-statpill.pw-up-pop{animation:pwPopUp .48s ease-out}
.ar-statpill.pw-dn-pop{animation:pwPopDn .55s ease-out}
@keyframes pwPopUp{
 0%{transform:translateX(-50%) scale(1)}
 40%{transform:translateX(-50%) scale(1.28);box-shadow:0 0 18px rgba(251,191,36,.95)}
 100%{transform:translateX(-50%) scale(1)}
}
@keyframes pwPopDn{
 0%{transform:translateX(-50%) scale(1)}
 35%{transform:translateX(-50%) scale(1.32);box-shadow:0 0 20px rgba(239,68,68,.98);background:#7f1d1d;color:#fff}
 100%{transform:translateX(-50%) scale(1)}
}

/* 6. Center Guardian Circle Barrier Dome (Sits over printed G Circle!) */
.ar-gbarrier{
 width:min(94%,480px);margin:0 auto 4px;padding:7px 14px;border-radius:16px;
 background:
  radial-gradient(circle at 50% 50%,rgba(56,189,248,.28) 0%,rgba(14,116,144,.2) 55%,rgba(6,14,28,.94) 100%);
 border:2px solid #38bdf8;
 box-shadow:0 0 28px rgba(56,189,248,.58),inset 0 0 18px rgba(56,189,248,.32);
 display:flex;flex-direction:column;align-items:center;gap:5px;
 animation:gbAppear .24s cubic-bezier(.16,1,.3,1);
}
.ar-gbarrier.pg{
 border-color:#fde047;
 background:radial-gradient(circle at 50% 50%,rgba(250,204,21,.28),rgba(14,116,144,.25) 55%,rgba(12,18,32,.95) 100%);
 box-shadow:0 0 34px rgba(250,204,21,.68),inset 0 0 22px rgba(250,204,21,.34);
}
.ar-gbarrier .gb-hd{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:900;letter-spacing:.1em;color:#7dd3fc}
.ar-gbarrier.pg .gb-hd{color:#fef08a}
.ar-gbarrier .gb-hd b{font-size:14.5px;color:#fff;text-shadow:0 0 10px rgba(56,189,248,.85)}
.ar-gbarrier .gb-cards{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ar-gbarrier .gb-cards .ch.sm{--cw:42px;width:42px;box-shadow:0 4px 12px rgba(0,0,0,.85)}
@keyframes gbAppear{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}

/* 7. Side-by-Side Drive Check Stack Tray (First / Second / Third Check!) */
#reveal.drive-multi{
 width:auto!important;max-width:min(520px,88vw)!important;
}
.rv-tray{
 display:flex;align-items:flex-end;justify-content:center;gap:10px;
}
.rv-prev-card{

}
.rv-prev-card.t-trig{border-color:#fbbf24;box-shadow:0 0 22px rgba(251,191,36,.65)}
.rv-prev-card.t-over{border-color:#fde047;box-shadow:0 0 28px rgba(253,224,71,.9)}
.rv-prev-card img{width:100%;height:100%;object-fit:cover;display:block}
.rv-prev-card .pv-lbl{
 position:absolute;top:3px;left:3px;background:rgba(4,8,16,.88);color:#7dd3fc;
 font-size:9px;font-weight:900;padding:1px 5px;border-radius:4px;letter-spacing:.06em;
}
.rv-prev-card .pv-tr{
 position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:9px;font-weight:900;
 padding:2px;background:rgba(4,8,16,.86);color:#e2e8f0;
}
.rv-prev-card.t-trig .pv-tr{background:linear-gradient(90deg,#b45309,#f59e0b);color:#fff}

/* 8. Quick Scry UI (Top / Bottom / Hand / Call / Drop / Soul in one panel) */
.scry-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.scry-item{
 width:126px;background:rgba(15,23,42,.92);border:1.5px solid rgba(148,163,184,.28);
 border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;
 transition:border-color .15s,box-shadow .15s;
}

/* =====================  FLANKING DEITY ARMS ON VC (v16)  ===================== */
.ar-arm{

}

}
/* Player (s=0): Right Deity Arms = Bavsargra's right hand = viewer's LEFT; Left Deity Arms = viewer's RIGHT */
.ar-mat:not(.opp) .ar-arm.side-right{right:84%;transform-origin:right center;animation:armSlideL .32s cubic-bezier(.16,1,.3,1)}
.ar-mat:not(.opp) .ar-arm.side-left{left:84%;transform-origin:left center;animation:armSlideR .32s cubic-bezier(.16,1,.3,1)}
/* Opponent (s=1): Mirrored across table */
.ar-mat.opp .ar-arm.side-right{left:84%;transform-origin:left center;animation:armSlideR .32s cubic-bezier(.16,1,.3,1)}
.ar-mat.opp .ar-arm.side-left{right:84%;transform-origin:right center;animation:armSlideL .32s cubic-bezier(.16,1,.3,1)}

.ar-arm:hover{

.ar-arm.cyber-arm .arm-tag{color:#7dd3fc}

/* Shift SOUL pill neatly above VC when Arms are equipped so it never collides */
.cell.has-arms .ar-soulpill{
 left:50%!important;right:auto!important;top:-15px!important;bottom:auto!important;
 transform:translateX(-50%);
}
.ar-mat.opp .cell.has-arms .ar-soulpill{

}

@keyframes armSlideL{from{opacity:0;transform:translateX(28%) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes armSlideR{from{opacity:0;transform:translateX(-28%) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}

.cam-shake-sm{animation:camShakeSm .28s cubic-bezier(.36,.07,.19,.97)}

.cam-shake-ultra{animation:camShakeUltra .62s cubic-bezier(.36,.07,.19,.97)}
@keyframes camShakeSm{
 0%,100%{transform:translate3d(0,0,0)}
 20%{transform:translate3d(-4px,2px,0)}
 45%{transform:translate3d(4px,-2px,0)}
 70%{transform:translate3d(-2px,1px,0)}
}
@keyframes camShakeLg{

 14%{transform:translate3d(-9px,5px,0) scale(1.012)}
 30%{transform:translate3d(8px,-5px,0) scale(1.008)}
 48%{transform:translate3d(-6px,-3px,0)}
 68%{transform:translate3d(4px,3px,0)}
 85%{transform:translate3d(-2px,-1px,0)}
}

<script>
"use strict";
const $=s=>document.querySelector(s);
const NAT={ "Dragon Empire":"--n-dragon","Dark States":"--n-dark","Keter Sanctuary":"--n-keter","Brandt Gate":"--n-brandt","Stoicheia":"--n-stoi","Lyrical Monasterio":"--n-lyrical"};
const TRIG=/^(Critical|Draw|Stand|Heal|Front|Over)\b/;
let CARDS=[],BY={};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- card store (IndexedDB, falls back to memory) ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("vgdeck",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise(r=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}

/* ---------- card images (resized, local only) ---------- */
const IMG={};let imgBlobs={};
const SZ=360,Q=0.8;
function noFromFile(n){const m=n.replace(/\.[^.]+$/,"").match(/^(D-[A-Z]+\d+)[_\/](\d+)EN$/i);return m?m[1].toUpperCase()+"/"+m[2]:null}
async function shrink(file){
 const bmp=await createImageBitmap(file);const w=Math.min(SZ,bmp.width),h=Math.round(bmp.height*w/bmp.width);
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(bmp,0,0,w,h);
 return await new Promise(r=>cv.toBlob(r,"image/webp",Q));
}
async function putImg(no,blob){imgBlobs[no]=blob;if(IMG[no])URL.revokeObjectURL(IMG[no]);IMG[no]=URL.createObjectURL(blob);await idbSet("img:"+no,blob)}
function imgInfo(){const n=Object.keys(imgBlobs).length;const kb=Object.values(imgBlobs).reduce((a,b)=>a+b.size,0)/1024;$("#imInfo").textContent=n?`${n} รูป · ${(kb/1024).toFixed(1)} MB`:"ยังไม่มีรูป"}
async function loadImgs(){
 try{const db=await idb();await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").openCursor();q.onsuccess=()=>{const c=q.result;if(!c){res();return}
  if(String(c.key).startsWith("img:")&&c.value instanceof Blob){const no=c.key.slice(4);imgBlobs[no]=c.value;IMG[no]=URL.createObjectURL(c.value)}c.continue()};q.onerror=()=>res()})}catch(e){}
 imgInfo()}
async function importImages(files){
 let ok=0,skip=0;const list=[...files];
 for(let i=0;i<list.length;i++){const f=list[i];const no=noFromFile(f.name);
  if(!no||!BY[no]){skip++;continue}
  try{await putImg(no,await shrink(f));ok++}catch(e){skip++}
  if(i%10===0)$("#imInfo").textContent=`กำลังย่อ ${i+1}/${list.length}…`;
  if(i%10===0)await new Promise(r=>setTimeout(r));}
 imgInfo();flash(`นำเข้ารูป ${ok} ใบ`+(skip?` (ข้าม ${skip} ไฟล์ที่ชื่อไม่ตรงการ์ด เช่นรูปพาราเรล)`:""));
}
async function buildPack(withCards){
 const keys=Object.keys(imgBlobs);
 if(!withCards&&!keys.length){flash("ยังไม่มีรูปให้ส่งออก");return}
 if(withCards&&!RAW.length){flash("ยังไม่มีข้อมูลการ์ด");return}
 const magic=withCards?"VGPACK1\n":"VGIMG1\n";
 const hdr=withCards?{cards:RAW,imgs:keys.map(k=>({no:k,size:imgBlobs[k].size}))}:keys.map(k=>({no:k,size:imgBlobs[k].size}));
 const head=new TextEncoder().encode(JSON.stringify(hdr));
 const len=new Uint8Array(4);new DataView(len.buffer).setUint32(0,head.length);
 const blob=new Blob([new TextEncoder().encode(magic),len,head,...keys.map(k=>imgBlobs[k])],{type:"application/octet-stream"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=withCards?"vanguard-d.vgpack":"cards.vgimg";document.body.appendChild(a);a.click();a.remove();

function validate(){
 const dk=D(),out=[];
 const chip=(txt,st)=>out.push({txt,st});
 const mainCards=Object.entries(dk.main).map(([no,k])=>[BY[no],k]).filter(x=>x[0]);
 const sum=f=>mainCards.reduce((a,[c,k])=>a+(f(c)?k:0),0);
 const nm=total("main");
 const nr=total("ride");
 chip(`เด็คหลัก ${nm}/46`,nm===46?"ok":nm>46?"bad":"warn");
 const rgr=Object.entries(dk.ride).flatMap(([no,k])=>Array(k).fill(BY[no]?BY[no].grade:null)).sort().join();
 const isGriph=Object.keys(dk.ride).some(k=>(BY[k]||{}).name==="Griphosid");const rMax=isGriph?5:4;
 chip(`ไรด์เด็ค ${nr}/${rMax}${!isGriph&&nr===4&&rgr!=="0,1,2,3"?" (ต้องเป็นเกรด 0-3 อย่างละใบ)":""}`,isGriph?(nr===5?"ok":nr>5?"bad":"warn"):(nr===4&&rgr==="0,1,2,3"?"ok":nr>4?"bad":"warn"));
 chip(`รวม ${nm+nr}/50`,nm+nr===50?"ok":nm+nr>50?"bad":"warn");
 const tr=sum(c=>!!c.trig)+Object.entries(dk.ride).reduce((a,[no,k])=>a+(BY[no]&&BY[no].trig?k:0),0);chip(`ทริกเกอร์ ${tr}/16`,tr===16?"ok":tr>16?"bad":"warn");
 const heal=sum(c=>c.trig==="Heal");chip(`Heal ${heal}/4`,heal<=4?"ok":"bad");
 const ov=sum(c=>c.trig==="Over");chip(`Over ${ov}/1`,ov<=1?"ok":"bad");
 const se=sum(c=>c.sentinel);chip(`Sentinel ${se}/4`,se<=4?"ok":"bad");
 const rg=sum(c=>c.regalis);chip(`Regalis Piece ${rg}/1`,rg<=1?"ok":"bad");
 const gMain=mainCards.filter(([c])=>c.isG).length;
 if(gMain)chip("มีการ์ด G ในเด็คหลัก","bad");
 const gd=total("g");chip(`G เด็ค ${gd}/16`,gd<=16?"ok":"bad");
 // same name <= 4 across main+ride
 const names={};for(const z of["main","ride"])for(const[no,k]of Object.entries(dk[z])){const c=BY[no];if(c)names[c.name]=(names[c.name]||0)+k}
 const over=Object.entries(names).filter(([nm2,k])=>{const c=CARDS.find(x=>x.name===nm2);return k>(c?nameLimit(c):4)});
 chip(over.length?`ชื่อซ้ำเกิน 4: ${over.map(o=>o[0]).join(", ")}`:"ชื่อซ้ำไม่เกิน 4","")
 out[out.length-1].st=over.length?"bad":"ok";
 // ace
 if(dk.ace){const a=BY[dk.ace];chip("Ace: "+(a?a.name:dk.ace),(dk.main[dk.ace]||0)>0?"ok":"bad")}
 const odd=mainCards.filter(([c])=>c.grade!=null&&c.grade>=4).length;
 if(odd)chip("มีเกรด 4+ (กฎยังไม่ยืนยัน)","warn");
 return out;
}

const PQTY={
 "D-SD01":[4,4,4,1,3,4,3,4,4,1,4,4,3,4,3],
 "D-SD02":[4,4,4,1,4,3,3,4,4,1,4,4,3,4,3],

};
function makePreset(set){
 const cs=CARDS.filter(c=>c.set===set);if(!cs.length)return null;
 const d={name:PNAME[set]||set,main:{},ride:{},g:{},ace:null,exact:!!PQTY[set]};
 const first4=cs.slice(0,4).map(c=>c.grade).join()==="3,2,1,0";
 const Q=PQTY[set]||(/^D-TD/.test(set)?PQTY["D-TD02"]:null);
 if(Q){
  Q.forEach((q,i)=>{const c=cs[i];if(!c)return;
   if(c.grade!=null&&c.grade>=4){d.g[c.no]=q;return}
   if(first4&&i<4){d.ride[c.no]=1;q--}
   if(q>0)d.main[c.no]=q});
  return d;
 }
 // no published list found: 001-003 x4 (one goes to the ride deck), 004 x1, over x1, the rest filled evenly up to 50 in total
 const pool=[];
 cs.slice(0,15).forEach((c,i)=>{if(first4&&i<4){d.ride[c.no]=1;if(i<3){d.main[c.no]=3}}else{d.main[c.no]=1;pool.push(c)}});
 const tot=()=>Object.values(d.main).reduce((a,b)=>a+b,0)+Object.keys(d.ride).length;
 const cnt=f=>pool.reduce((a,c)=>a+(f(c)?d.main[c.no]:0),0);
 let ch=true;
 while(tot()<50&&ch){ch=false;for(const c of pool){if(tot()>=50)break;if(d.main[c.no]>=4)continue;if(c.trig==="Over"||c.regalis)continue;if(c.trig&&cnt(x=>!!x.trig)>=16)continue;if(c.trig==="Heal"&&cnt(x=>x.trig==="Heal")>=4)continue;d.main[c.no]++;ch=true}}
 return d;
}
