async function loadHostedCards(){
 if(!location.protocol.startsWith("http"))return false;
 const box=$("#loader .box"),origHTML=box?box.innerHTML:"";
 try{
  setLoaderUI("กำลังโหลดข้อมูลการ์ด","กำลังดึงไฟล์ cards.json…","ไม่ถึง 1 วินาที",null,"เข้าหน้าจัดเด็คได้ทันที ส่วนรูปการ์ดจะทยอยโหลดให้ในพื้นหลัง");
  const res=await fetch("./cards.json");
  if(!res.ok){if(box)box.innerHTML=origHTML;return false}
  const raw=await res.json();
  if(!Array.isArray(raw)||!raw.length){if(box)box.innerHTML=origHTML;return false}
  await idbSet("cards",raw);
  setCards(raw);
  $("#loader").hidden=true;
  return true;
 }catch(e){if(box)box.innerHTML=origHTML;return false}
}
async function loadHostedImgParts(){
 if(!location.protocol.startsWith("http"))return;
 const TOTAL=7;
 const missing=[];
 for(let i=1;i<=TOTAL;i++){if(!(await idbGet("imgPart:"+i)))missing.push(i)}
 if(!missing.length)return;
 const el=$("#bgLoad"),txt=$("#bglTxt"),pct=$("#bglPct"),fill=$("#bglFill");
 let loadedAny=false;
 for(let idx=0;idx<missing.length;idx++){
  const p=missing[idx];
  try{
   const res=await fetch(`./img-${p}.vgimg`);
   if(!res.ok)break;
   if(el)el.hidden=false;
   const doneBefore=TOTAL-missing.length+idx;
   const updateUI=(subPct)=>{
    const overall=Math.round(((doneBefore+subPct)/TOTAL)*100);
    if(txt)txt.textContent=`กำลังโหลดรูปการ์ด (พาร์ต ${p}/${TOTAL})`;
    if(pct)pct.textContent=overall+"%";
    if(fill)fill.style.width=overall+"%";
   };
   updateUI(0.05);
   const total=+(res.headers.get("content-length")||0);
   let buf;
   if(res.body&&res.body.getReader){
    const reader=res.body.getReader(),chunks=[];let got=0,lastT=0;
    while(true){
     const{done,value}=await reader.read();
     if(done)break;
     chunks.push(value);got+=value.byteLength;
     const now=Date.now();
     if(now-lastT>120){lastT=now;updateUI(total?Math.min(0.95,got/total):0.5)}
    }
    const out=new Uint8Array(got);let off=0;for(const c of chunks){out.set(c,off);off+=c.byteLength}
    buf=out.buffer;
   }else{
    buf=await res.arrayBuffer();
   }
   await importBuf(buf,true);
   await idbSet("imgPart:"+p,1);
   loadedAny=true;
   updateUI(1);
   if(zno&&!$("#zoom").hidden)paintZoom();if(gridView==="img")paintGrid();renderLobby();
  }catch(e){break}
 }
 if(el&&loadedAny){
  if(txt)txt.textContent="โหลดรูปการ์ดครบทั้งหมดแล้ว ✓";
  if(pct)pct.textContent="100%";
  if(fill)fill.style.width="100%";
  setTimeout(()=>{el.hidden=true},2200);
 }else if(el){el.hidden=true}
}
(async()=>{

function clansOf(c){if(!c||!c.race)return[];return CLANS.filter(cl=>c.race.includes(cl))}
function hasOnlyClan(u,cl){const cs=clansOf(cd(u));return cs.length===1&&(!cl||cs[0].toLowerCase()===cl.toLowerCase())}
function soulDiffNames(P){const s=new Set();let mik=0;for(const x of P.soul){const nm=cd(x).name;if(nm==="Go Ahead, Mikani")mik++;else s.add(nm)}return s.size+mik}

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function driveProtected(s,u){return G.turn===s&&cd(u).body.some(l=>/drive cannot decrease from card effects/i.test(l))&&G.p[s].soul.some(x=>cd(x).name==="Dragonic Overlord")}
function crossPersona(oc,c){
 if(!oc.persona||!c.persona)return false;
 if(oc.name===c.name)return true;
 if(oc.body.some(l=>/regarded as persona ride too/i.test(l)))return true;
 if(oc.body.some(l=>/with ["“]Thegrea["”] in its different card name/i.test(l))&&c.name.includes("Thegrea"))return true;
 if(oc.body.some(l=>new RegExp(`regarded as "${escRe(c.name)}"`,"i").test(l)))return true;
 return false;
}
function canBackRowIntercept(d,k,u){
 if(!BACK.includes(k)||!u||u.locked||u.rest)return false;
 const P=G.p[d];
 if(P.c.VC&&cd(P.c.VC).name==="Sylvan Horned Beast Emperor, Magnolia Elder"&&(P.soul.some(x=>cd(x).name.includes("Magnolia"))||units(d).some(x=>x[0]!=="VC"&&cd(x[1]).name.includes("Magnolia"))))return true;
 const c=cd(u),txt=linesOf(u).join("\n");
 if(!/intercept from the back row/i.test(txt))return false;
 if(c.name==="Indiscriminate Shooting Mutant, Barretwasp")return true;
 if(c.name==="Cardinal Draco, Culjameed")return["Dark Night","Abyssal Dark Night"].includes(worldOf(d));
 if(c.name==="Leapmya")return!u.rest;
 if(c.name==="Aurora Battle Princess, Trace Jeune")return prisonCount(d)>=1;
 if(c.name==="Diverse Wild Master, Honoratio")return new Set(P.soul.map(x=>cd(x).name)).size>=8;
 if(c.name==="Spry Cactus")return!!P.mk[k];
 if(c.name==="Gear Serow of Magnetic Resonance")return gbCount(d)>=1;
 if(c.name==="Explorer of the Grand Ravine, C. K. Sakatt")return k==="BC";
 return true;
}
function multiTargetMode(s,k,u){
 const txt=linesOf(u).join("\n");
 const P=G.p[s];
 if(k==="VC"&&P.vermilionMulti)return"vermilion";
 if(/battles all of your opponent's (?:front row units|units in the front row)/i.test(txt)){
  if(cd(u).name==="Great Sword of Fierce Black Flame, Obscudeid")return(u.placedByAbility&&P.order.filter(x=>raceHas(x,"Research")).length>=3)?"front":null;
  if(cd(u).name==="Sylvan Horned Beast, Bojalcorn")return BACK.includes(k)?"front":null;
  return"front";
 }
 if(/battles all of your opponent's rear-guards/i.test(txt))return"allrg";
 if(/battles all of your opponent's units(?! in)/i.test(txt))return"all";
 if(/battles all of (?:your opponent's units|the units) in (?:a|one of your opponent's) columns?/i.test(txt)){
  if(cd(u).name==="Diabolos Jetbacker, Lenard")return(P.states["Final Rush"]||P.states["Final Burst"])?"col":null;
  if(cd(u).name==="Lightning Thief Monster, Jabattail")return worldOf(s)==="Abyssal Dark Night"?"col":null;
  return"col";
 }
 return null;
}

 if(P.atkBackRow||multiTargetMode(s,ak,u)==="col")return true;

  const oc=({L:"R",R:"L",C:"C"})[COLOF[ak]];if(COLOF[oppK]===oc)return true;

}
function canMoveSameRow(s){return G.p[s].moveSameRow||units(s).some(([k,x])=>k!=="VC"&&cd(x).name==="Maiden of Deep Impression, Urjula")}

 // drive step (10.6) - vanguard or RG with Amartinoa

 const mt=multiTargetMode(a,ak,att);

 if(!G.over)for(const x of PA.hand.slice()){if(G.over)break;if(PA.hand.includes(x))await fire("endAnyAtk",a,x,{where:"Hand",attName:cd(att).name})}

async function applyTrigger(s,u,fromDrive,atk,revealed=false){

 const t=c.trig,bot=G.cfg.bots[s];
 const oppNull=G.p[1-s].nullTrigIcons&&G.p[1-s].removed.some(x=>cd(x).trig===t);
 const trigBonus=(!oppNull&&fromDrive)?((P.trigPowBonus||0)+(P.c.VC&&cd(P.c.VC).name.includes("Aquamarine")&&P.personaRode?10000:0)):0;
 const pw=oppNull?0:((c.tpow||0)+trigBonus);
 if(oppNull)log(`Evil Eye ของ${SIDE[1-s]}: ตัดการบวกพลังจากทริกเกอร์ ${t}!`);
 const times=(G.battle&&G.battle.doubleTrig&&fromDrive)?2:1;
 if(G.stats){G.stats.trig[s]++;if(t==="Critical")G.stats.crit[s]++;else if(t==="Heal")G.stats.heal[s]++;else if(t==="Over")G.stats.over[s]++}
 const pick=async(title)=>{

  if(bot){
   if(!fromDrive)return P.c.VC;
   const standAtk=us.filter(([k,x])=>!x.rest&&k!=="VC"&&(FRONT.includes(k)||canBackAtk(x)));
   if(standAtk.length){
    standAtk.sort((p,q)=>(unitPower(q[1])+(boosterOf(s,q[0])?unitPower(boosterOf(s,q[0])):0))-(unitPower(p[1])+(boosterOf(s,p[0])?unitPower(boosterOf(s,p[0])):0)));
    return standAtk[0][1];
   }
   return atk&&us.find(x=>x[1]===atk)?atk:us[0][1];
  }
  if(us.length===1)return us[0][1];
  return(await chooseUnit(s,title,us))||P.c.VC;
 };
 const tKey=t.toLowerCase();const vMap={Critical:"crit",Front:"front",Draw:"draw",Heal:"heal",Over:"over"};if(vMap[t])VOICE.play(vMap[t]);try{VFX.triggerFX(t,s,"VC")}catch(e){}if(!revealed){if(t==="Over"){SFX.epic();showCutin("OVER TRIGGER!",`${c.name} · +100,000,000`,"over")}else{SFX.trigger();showCutin(`${t.toUpperCase()} TRIGGER!`,`${c.name}${pw?` · +${pw.toLocaleString()}`:""}`,CI_STYLE[tKey]?tKey:"crit")}}

   P.damage.splice(P.damage.indexOf(h),1);resetUnit(h);P.drop.push(h);log(`${SIDE[s]}ฮีล 1 ดาเมจ`)}
  else log("ฮีลไม่ได้ (ดาเมจน้อยกว่าอีกฝ่าย)");
 }

 else{for(let ti=0;ti<times;ti++){const x=await pick(`ทริกเกอร์ ${t} (${ti+1}/${times}): เลือกยูนิตที่ได้พลัง +${pw}`);if(x){x.pw+=pw;x.trigModTurn=true;log(`${cd(x).name} +${pw}`)}}}

function moveCard(u,to){ // move any card of a player to one of their zones (its originalDress cards follow it, 6.7.5)
 const s=sideOfCard(u),P=G.p[s];
 const h=holderOf(u);

 if(h){h.x.od.splice(h.x.od.indexOf(u),1);if(!h.x.od.length)h.x.odType=null}
 else{if(w0){
  if(w0.k!=="VC"&&to==="deckBottom"&&G){G.p[0].botDeckTurn=true;G.p[1].botDeckTurn=true}
  if(w0.k!=="VC"&&to==="soul"&&G){G.p[w0.s].rcToSoulCountTurn=(G.p[w0.s].rcToSoulCountTurn||0)+1;queueFx(w0.s,"VC","soul")}

 if(!w0&&to==="soul")queueFx(s,"VC","soul");

  if(x.token)return;
  if(to==="hand")P.hand.push(x);else if(to==="deckTop")P.deck.unshift(x);else if(to==="deckBottom")P.deck.push(x);
  else if(to==="drop")P.drop.push(x);else if(to==="soul")P.soul.push(x);else if(to==="damage")P.damage.push(x);
  else if(to==="damageDown"){x.down=true;P.damage.push(x)}else if(to==="removed")P.removed.push(x);

 };

}

function candidates(st,ctx){

  return true;
 });
}

const DEST={hand:"ขึ้นมือ",call:"คอลลงสนาม",callLock:"คอลแบบล็อก (คว่ำ)",scouted:"Scout เข้าฐาน",soul:"เข้าโซล",drop:"ลงดรอป",deckTop:"บนเด็ค",deckBottom:"ใต้เด็ค",removed:"ไบนด์",removedDown:"ไบนด์คว่ำหน้า",exile:"Remove ออกจากเกม",order:"เข้าโซนออเดอร์"};

function buildSearchFilter(text,s,u,ctx){
 const P=G.p[s],t=text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"');
 const mSeg=t.match(/(?:search your [^\.,]+? for|choose) ([\s\S]*?)(?:,| and (?:reveal|put|call|discard|bind|shuffle)|$)/i);
 const clause=mSeg?mSeg[1]:t;
 const branches=clause.split(/\bor up to (?:one|two|three|a) \b/i);
 const mkBranch=seg=>{
  const fns=[],tags=[];
  if(/grade \+1 of the card put on the bottom/i.test(t)&&ctx.bottomGrade!=null){
   const tg=ctx.bottomGrade+1;fns.push(x=>(cd(x).grade||0)===tg);tags.push("G"+tg);
  }else if(/grade equal to your vanguard's grade \+1 or greater/i.test(seg)){
   const tg=vgGrade(s)+1;fns.push(x=>(cd(x).grade||0)>=tg);tags.push(`G${tg}+`);
  }else if(/grade (?:equal to or less|less than or equal) to your vanguard/i.test(seg)){
   const tg=vgGrade(s);fns.push(x=>(cd(x).grade||0)<=tg);tags.push(`G≤${tg}`);
  }else{
   let gm;
   if((gm=seg.match(/\bgrade (\d) or (\d)\b/i))){const g1=+gm[1],g2=+gm[2];fns.push(x=>{const g=cd(x).grade;return g===g1||g===g2});tags.push(`G${g1}/G${g2}`)}
   else if((gm=seg.match(/\bgrade (\d) or greater\b/i))){const g1=+gm[1];fns.push(x=>(cd(x).grade??-1)>=g1);tags.push(`G${g1}+`)}
   else if((gm=seg.match(/\bgrade (\d) or less\b/i))){const g1=+gm[1];fns.push(x=>(cd(x).grade??99)<=g1);tags.push(`G≤${g1}`)}
   else if((gm=seg.match(/\bgrade (\d)\b/i))){const g1=+gm[1];fns.push(x=>cd(x).grade===g1);tags.push("G"+g1)}
  }
  if(/\bnormal unit/i.test(seg)){fns.push(x=>cd(x).type==="Normal Unit");tags.push("Normal Unit")}
  else if(/\btrigger unit/i.test(seg)){fns.push(x=>cd(x).type==="Trigger Unit");tags.push("Trigger")}
  else if(/\bunit card/i.test(seg)){fns.push(x=>isUnit(x));tags.push("ยูนิต")}
  if(/\bset order/i.test(seg)){fns.push(x=>cd(x).type==="Set Order");tags.push("Set Order")}
  else if(/\bnormal order/i.test(seg)){fns.push(x=>cd(x).type==="Normal Order");tags.push("Normal Order")}
  else if(/\bblitz order/i.test(seg)){fns.push(x=>cd(x).type==="Blitz Order");tags.push("Blitz Order")}
  else if(/\border card/i.test(seg)){fns.push(x=>!isUnit(x));tags.push("ออเดอร์")}
  if(/without \[Regalis Piece\]/i.test(seg)){fns.push(x=>!cd(x).regalis);tags.push("ไม่ใช่ Regalis")}
  if(/same card name as your vanguard/i.test(seg)){fns.push(x=>P.c.VC&&cd(x).name===cd(P.c.VC).name);tags.push("ชื่อเหมือน VG")}
  if(/same card name as this (?:card|unit)/i.test(seg)){fns.push(x=>cd(x).name===cd(u).name);tags.push(`"${cd(u).name}"`)}
  if(/with the \[overDress\] ability/i.test(seg)){fns.push(x=>hasODAbility(x));tags.push("[overDress]")}
  const qs=(seg.match(/"([^"]+)"/g)||[]).map(x=>x.replace(/"/g,""));
  if(qs.length){fns.push(x=>qs.some(n=>cd(x).name===n||cd(x).name.includes(n)));tags.push(qs.map(n=>`"${n}"`).join("/"))}
  const tw=(seg.match(/\b(World|Meteorite|Arms|Product|Prison|Research|Calamity|Prayer Dragon|Base|Strategy|Monster|Blue Storm Armada|Fox Art)\b/)||[])[1];
  if(tw){fns.push(x=>raceHas(x,tw)||(tw==="Arms"&&!!armSide(x)));tags.push(tw)}
  const rc=seg.match(/[<＜]([^>＞]+)[>＞]/);
  if(rc){const rv=rc[1].trim();fns.push(x=>raceHas(x,rv));tags.push(`<${rv}>`)}
  return{fns,tags};
 };
 const bs=branches.map(mkBranch).filter(b=>b.fns.length>0);
 if(!bs.length)return{hasFilter:false,fn:()=>true,desc:""};
 return{
  hasFilter:true,
  fn:x=>bs.some(b=>b.fns.every(f=>f(x))),
  desc:bs.map(b=>b.tags.join(" · ")).join(" หรือ ")
 };
}

async function runAbility0(a,i,ctx){

  if(!v)return false;
 }
 if(bot&&(!a.auto||a.steps.some(x=>x.assist)))return false;

 if(!bot&&first&&first.t!=="cost"&&!a.auto&&!ctx.noAsk){ /* partly manual and free: tell the player it triggered */ }

  if(G.over)return did;
  const ok=await runStep(st,ctx,a);

  did=true;render();
 }
 const stopped=a.steps.length&&!did;
 if(!G.over&&a.manualRest&&!bot&&!stopped&&!gated){
  const costStopped=a.steps.some(x=>x.t==="cost")&&!did;
  if(!costStopped){await manualStep(name,a.manualRest.replace(/§COST\d§,?\s*/g,"[มีคอสต์เพิ่ม] "));did=true}
 }
 if(did&&a.once&&i>=0)u.used[i]=G.n;

 render();return did;
}

const SFX=(()=>{
 let ctx=null;
 const ac=()=>{if(!sfxOn)return null;try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}catch(e){return null}};
 const tone=(f1,f2,dur,type="sine",vol=.12,delay=0)=>{
  const c=ac();if(!c)return;const t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
 };
 const noise=(dur,freq=1200,vol=.08,delay=0)=>{
  const c=ac();if(!c)return;const t=c.currentTime+delay,sz=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,sz,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<sz;i++)d[i]=(Math.random()*2-1)*(1-i/sz);
  const src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  src.buffer=buf;fl.type="bandpass";fl.frequency.setValueAtTime(freq,t);fl.Q.value=1.2;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(fl);fl.connect(g);g.connect(c.destination);src.start(t);
 };
 return{
  draw(){noise(.08,2400,.06);tone(520,760,.07,"triangle",.04)},
  call(){tone(190,110,.1,"triangle",.14);noise(.05,900,.06)},
  ride(){tone(330,440,.14,"triangle",.11);tone(554,659,.22,"sine",.1,.07)},
  attack(){noise(.14,1800,.11);tone(260,95,.14,"sawtooth",.09)},

 };

/* =====================  v14 LIVE CELL FX, ROLLING POWER & ARENA AURA  ===================== */
const _fxQ=[];
const _lastPow=new Map();
function queueFx(s,k,kind){if(G&&!G.quit)_fxQ.push({s,k,kind})}
function flushFx(){
 while(_fxQ.length){
  const{s,k,kind}=_fxQ.shift();
  const sel=document.querySelector(`.cell[data-s="${s}"][data-circ="${k}"]`);
  if(!sel)continue;
  const d=document.createElement("div");d.className=`fx-burst fx-${kind}`;
  sel.appendChild(d);setTimeout(()=>d.remove(),720);
  const pt=VFX.cellCenter(s,k);
  if(kind==="retire"){VFX.addSlash(pt.x,pt.y,"#f97316",85,-0.5,0.34);VFX.spawnBurst(pt.x,pt.y,"retire",32,1.15,{shard:true});VFX.addRing(pt.x,pt.y,"#f97316",120,3.5,0.44,true);VFX.addText(pt.x,pt.y-16,"RETIRE!","#fb923c",15,0.72)}
  else if(kind==="remove"){VFX.addSlash(pt.x,pt.y,"#c084fc",90,0.6,0.36);VFX.spawnBurst(pt.x,pt.y,"bind",32,1.15,{shard:true,gravity:0});VFX.addRing(pt.x,pt.y,"#c084fc",125,3.5,0.46,true);VFX.addText(pt.x,pt.y-16,"BIND!","#e879f9",15,0.72)}
  else if(kind==="soul"){VFX.spawnBurst(pt.x,pt.y,"bind",18,0.8)}
  else if(kind==="marker"){VFX.spawnBurst(pt.x,pt.y,"heal",24,1.0);VFX.addRing(pt.x,pt.y,"#34d399",120,3.5,0.45)}
  else if(kind==="swap"){VFX.spawnBurst(pt.x,pt.y,"draw",16,0.75)}
 }
}
function animatePowers(){
 document.querySelectorAll(".ar-statpill[data-pw]").forEach(el=>{
  const key=el.dataset.key,target=+el.dataset.pw;
  const numEl=el.querySelector(".st-pw");if(!numEl)return;
  const prev=_lastPow.get(key);
  _lastPow.set(key,target);
  if(prev==null||prev===target)return;
  el.classList.remove("pw-up-pop","pw-dn-pop");
  void el.offsetWidth;
  el.classList.add(target>prev?"pw-up-pop":"pw-dn-pop");
  const start=performance.now(),dur=360,diff=target-prev;
  const tick=now=>{
   const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
   numEl.textContent=Math.round(prev+diff*e).toLocaleString();
   if(t<1)requestAnimationFrame(tick);else numEl.textContent=target.toLocaleString();
  };
  requestAnimationFrame(tick);
 });
 // Prune emptied slots from _lastPow
 for(const key of [..._lastPow.keys()]){
  const[s,k]=key.split(":");
  if(!G||!G.p[+s]||!G.p[+s].c[k])_lastPow.delete(key);
 }
}
function renderFlamePillars(mode){
 const fl=$("#flameLayer");if(!fl)return;
 if(!mode){fl.className="";fl.innerHTML="";return}
 if(fl.className!==mode){
  const pillars=['p1','p2','p3','p4','p5','p6'].map(c=>`<div class="fl-pillar ${c}"></div>`).join("");
  const sparks=Array.from({length:mode==="burst"?16:7},(_,i)=>{
   const left=((i*7.3+9)%82)+9;
   const dx=((i%2===0?1:-1)*(12+(i*5)%24))+"px";
   const del=(-(i*0.23)).toFixed(2)+"s";
   return `<span class="fl-spark" style="left:${left}%;--dx:${dx};animation-delay:${del}"></span>`;
  }).join("");
  fl.innerHTML=pillars+sparks;
  fl.className=mode;
 }
}
function updateArenaAura(){
 const pl=$("#play");if(!pl||!G)return;
 let aura="",flameMode="";
 for(const s of[G.turn,1-G.turn]){
  const P=G.p[s],vc=P.c.VC?cd(P.c.VC):null;
  if(P.states["Final Burst"])flameMode="burst";
  else if(!flameMode&&P.states["Final Rush"])flameMode="rush";
  if(!vc)continue;
  if(!aura&&vc.name.includes("Masques"))aura="masques";
  else if(!aura&&vc.body.some(l=>/^\[RevolDress\]/.test(l))&&vc.name.includes("RevolForm"))aura="revol";
  else if(!aura&&vc.isG)aura="stride";
  else if(!aura&&(P.states["Final Rush"]||P.states["Final Burst"]))aura=P.states["Final Burst"]?"final":"rush";
 }
 if(!aura){
  const w0=worldOf(0)||worldOf(1);
  if(w0)aura=w0==="Abyssal Dark Night"?"abyssal":"world";
  else for(const s of[0,1]){
   const v=G.p[s].c.VC;
   if(v&&cd(v).name.includes("Baromagnes")&&G.p[s].soul.length>=10){aura=G.p[s].soul.length>=15?"soul15":"soul10";break}
  }
 }
 if(aura)pl.dataset.aura=aura;else delete pl.dataset.aura;
 renderFlamePillars(flameMode);
}

}

const SKINS={mat0:null,mat1:null,sleeve:null};
async function loadSkins(){
 for(const k of["mat0","mat1","sleeve"]){
  try{const b=await idbGet("skin:"+k);if(b instanceof Blob){if(SKINS[k])URL.revokeObjectURL(SKINS[k]);SKINS[k]=URL.createObjectURL(b)}}catch(e){}
 }
 applySkins();
}
function applySkins(){
 const pl=$("#play");if(!pl)return;
 if(SKINS.sleeve){pl.classList.add("has-sleeve");pl.style.setProperty("--sleeve-url",`url("${SKINS.sleeve}")`)}
 else{pl.classList.remove("has-sleeve");pl.style.removeProperty("--sleeve-url")}
 if(G&&!G.quit)render();
}
async function saveSkin(key,file){
 if(!file)return;
 try{
  const bmp=await createImageBitmap(file),maxW=key==="sleeve"?360:1100;
  const w=Math.min(maxW,bmp.width),h=Math.round(bmp.height*w/bmp.width);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,"image/webp",0.86));
  await idbSet("skin:"+key,blob);
  if(SKINS[key])URL.revokeObjectURL(SKINS[key]);
  SKINS[key]=URL.createObjectURL(blob);
  applySkins();
 }catch(e){console.error(e)}
}
function openSkinMenu(){
 if(!$("#pmodal").hidden)return;
 sheet(`<h3>🖼️ ปรับแต่งสนาม & หลังการ์ด (Playmat / Sleeve)</h3>
  <p class="note">อัปโหลดรูปแผ่นรองเล่น (Playmat) หรือลายซองใส่การ์ด (Sleeve) ของคุณเอง รูปจะถูกย่อและเก็บไว้ในเครื่องอัตโนมัติ</p>
  <div class="mrow2">
   <button data-m="mat0" class="big">อัปโหลด Playmat ฝั่งคุณ</button>
   <button data-m="mat1">อัปโหลด Playmat ฝั่งตรงข้าม</button>
   <button data-m="sleeve">อัปโหลดลายหลังการ์ด (Sleeve)</button>
  </div>
  <div class="mrow2">
   <button data-m="clr:mat0">คืนค่า Playmat มาตรฐาน (คุณ)</button>
   <button data-m="clr:mat1">คืนค่า Playmat มาตรฐาน (อีกฝ่าย)</button>
   <button data-m="clr:sleeve">ล้างลายหลังการ์ด</button>
  </div>
  <div class="mbtn"><button data-m="close">ปิด</button></div>`,async(k,b,done)=>{
  if(k==="mat0"){done();$("#fMat0").click()}
  else if(k==="mat1"){done();$("#fMat1").click()}
  else if(k==="sleeve"){done();$("#fSleeve").click()}
  else if(k.startsWith("clr:")){
   const key=k.slice(4);
   try{const db=await idb();await new Promise(r=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete("skin:"+key);t.oncomplete=r;t.onerror=r})}catch(e){}
   if(SKINS[key])URL.revokeObjectURL(SKINS[key]);SKINS[key]=null;applySkins();done();
  }
 });
}
let pbTimer=0;
function showPhaseBanner(phaseLabel,sub,fromNet=false){
 if(!fromNet&&isOnline()&&!isGuest())netPushFX({kind:"banner",a:phaseLabel,b:sub});
 const el=$("#pbanner");if(!el||!G||G.quit)return;
 el.hidden=false;
 el.innerHTML=`<div class="pb-strip">${sub?`<small>${esc(sub)}</small>`:""}<b>${esc(phaseLabel)}</b></div>`;
 clearTimeout(pbTimer);pbTimer=setTimeout(()=>{el.hidden=true;el.innerHTML=""},Math.round(860*speedMult()*1.25));
}
function pushFeed(side,title,detail,cardNo=null){
 if(!G)return;
 G.feed=G.feed||[];
 G.feed.push({side,title,detail,cardNo});
 if(G.feed.length>14)G.feed.shift();
}
function formatBodyLine(l){
 const m=l.match(/^\[(AUTO|CONT|ACT)\](.*)$/);
 if(!m)return `<div>${esc(l)}</div>`;
 const cls=m[1].toLowerCase();
 return `<div><span class="ab-tag ${cls}">${m[1]}</span>${esc(m[2].replace(/^:/,"").trim())}</div>`;
}
function coinFlipPrompt(){
 let flipping=false;
 return ask(`<div class="coin-wrap">
  <h3>ทอยหัว-ก้อยครั้งเดียว</h3>
  <div class="coin-disc" id="cfDisc">H</div>
  <p class="note" id="cfTxt">หัว = ${esc(SIDE[0])}เริ่มก่อน · ก้อย = ${esc(SIDE[1])}เริ่มก่อน</p>
  <button class="btn-coral" id="cfBtn" data-m="flip">ทอยเหรียญ</button>
 </div>`,(b,m)=>{
  if(b.dataset.m==="flip"){
   if(flipping)return;flipping=true;
   b.textContent="กำลังทอย...";
   const win=Math.random()<.5?0:1;
   const d=m.querySelector("#cfDisc"),tx=m.querySelector("#cfTxt");
   SFX.flip();d.classList.add("spin");
   setTimeout(()=>{
    d.textContent=win===0?"H":"T";
    tx.innerHTML=win===0?`<b style="color:#58d68d">ออกหัว! ${esc(SIDE[0])}ได้เริ่มก่อน</b>`:`<b style="color:#fca5a5">ออกก้อย! ${esc(SIDE[1])}ได้เริ่มก่อน</b>`;
    b.textContent="เริ่มเกม ▶";
    SFX.trigger();
   },520);
   setTimeout(()=>{b.dataset.m="go";b.dataset.w=win;b.disabled=false;b.click()},1200);
   return;
  }
  if(b.dataset.m==="go")return +b.dataset.w;
 },0);
}

 shuf(deck);

 HT={deck,hand:deck.splice(0,5),mul:new Set(),didMul:false,draws:0,rideG3Name:rideG3?rideG3.name:null};

 $("#htModal").hidden=false;

}

 if(k==="close"){$("#htModal").hidden=true;return}

  if(cv.width!==Math.floor(w*dpr)||cv.height!==Math.floor(h*dpr)){

 function drawHex(x,y,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
   const a=Math.PI/3*i-Math.PI/6;
   const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
   if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
 }
 function loop(now){
  const dt=Math.min(0.05,Math.max(0.001,(now-lastT)/1000));
  lastT=now;
  const active=isPlayActive();
  if(ctx&&cv){
   const w=window.innerWidth,h=window.innerHeight;
   ctx.clearRect(0,0,w,h);

   // 1. Subtle Ambient Console Arena Motes
   if(active){
    const mc=themeMoteColor();
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    for(const m of motes){
     m.x+=m.vx*dt+Math.sin(now*0.001+m.ph)*6*dt;
     m.y+=m.vy*dt;
     if(m.y<-12){m.y=h+12;m.x=Math.random()*w}
     if(m.x<-12)m.x=w+12;else if(m.x>w+12)m.x=-12;
     const pulse=0.14+0.16*(0.5+0.5*Math.sin(now*0.0022+m.ph));
     ctx.globalAlpha=pulse;ctx.fillStyle=mc;
     ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
   }

   // 2. Screen Flashes
   for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];f.life+=dt;
    if(f.life>=f.maxLife){flashes.splice(i,1);continue}
    const a=1-f.life/f.maxLife;
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=f.col;ctx.fillRect(0,0,w,h);ctx.restore();
   }

   ctx.save();
   ctx.globalCompositeOperation="lighter";

   // 3. Radial Speedlines
   for(let i=speedlines.length-1;i>=0;i--){
    const sl=speedlines[i];sl.life+=dt;
    if(sl.life>=sl.maxLife){speedlines.splice(i,1);continue}
    const p=sl.life/sl.maxLife,a=(1-p)*0.75;
    const rStart=sl.r1+(sl.r2-sl.r1)*p*0.35;
    ctx.strokeStyle=sl.col;ctx.globalAlpha=a;ctx.lineWidth=sl.w*(1-p*0.5);
    ctx.beginPath();
    ctx.moveTo(sl.cx+Math.cos(sl.ang)*rStart,sl.cy+Math.sin(sl.ang)*rStart);
    ctx.lineTo(sl.cx+Math.cos(sl.ang)*sl.r2,sl.cy+Math.sin(sl.ang)*sl.r2);
    ctx.stroke();
   }

   // 4. Rotating Geometric Magic Circles (Runes)
   for(let i=runes.length-1;i>=0;i--){
    const rn=runes[i];rn.life+=dt;
    if(rn.life>=rn.maxLife){runes.splice(i,1);continue}
    const p=rn.life/rn.maxLife;
    const ease=1-Math.pow(1-p,3);
    const rad=rn.maxR*(0.35+0.65*ease);
    const a=(p<0.2?p/0.2:1-(p-0.2)/0.8)*0.88;
    ctx.save();
    ctx.translate(rn.x,rn.y);ctx.rotate(rn.rot+p*1.4);
    ctx.strokeStyle=rn.col;ctx.globalAlpha=a;ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1.2;ctx.globalAlpha=a*0.75;
    ctx.beginPath();ctx.arc(0,0,rad*0.84,0,Math.PI*2);ctx.stroke();
    // Inscribed hexagram
    for(let t=0;t<2;t++){
     ctx.beginPath();
     for(let v=0;v<3;v++){
      const ang=(v*2*Math.PI/3)+(t?Math.PI/3:0);
      const px=Math.cos(ang)*rad*0.84,py=Math.sin(ang)*rad*0.84;
      if(v===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
     }
     ctx.closePath();ctx.stroke();
    }
    ctx.restore();
   }

   // 5. Energy Beams / Light Pillars
   for(let i=beams.length-1;i>=0;i--){
    const b=beams[i];b.life+=dt;
    if(b.life>=b.maxLife){beams.splice(i,1);continue}
    const a=1-b.life/b.maxLife;
    ctx.lineCap="round";
    ctx.strokeStyle=b.col;ctx.globalAlpha=a*0.45;ctx.lineWidth=b.w*2.2*a;
    ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
    ctx.strokeStyle=b.col;ctx.globalAlpha=a*0.92;ctx.lineWidth=b.w*a;
    ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
    ctx.strokeStyle="#ffffff";ctx.globalAlpha=a;ctx.lineWidth=Math.max(1.8,b.w*0.35*a);
    ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();
   }

   // 6. Curved Anime / Console Slash Arcs
   for(let i=slashes.length-1;i>=0;i--){
    const s=slashes[i];s.life+=dt;
    if(s.life>=s.maxLife){slashes.splice(i,1);continue}
    const p=s.life/s.maxLife,a=1-p;
    const sc=0.65+0.55*(1-Math.pow(1-p,3));
    ctx.save();
    ctx.translate(s.x,s.y);ctx.rotate(s.ang);ctx.scale(sc,sc);
    const L=s.size;
    ctx.fillStyle=s.col;ctx.globalAlpha=a*0.75;
    ctx.beginPath();
    ctx.moveTo(-L,0);
    ctx.quadraticCurveTo(0,-L*0.42,L,0);
    ctx.quadraticCurveTo(0,-L*0.12,-L,0);
    ctx.fill();
    ctx.fillStyle="#ffffff";ctx.globalAlpha=a;
    ctx.beginPath();
    ctx.moveTo(-L*0.86,0);
    ctx.quadraticCurveTo(0,-L*0.26,L*0.86,0);
    ctx.quadraticCurveTo(0,-L*0.1,-L*0.86,0);
    ctx.fill();
    ctx.restore();
   }

   // 7. Procedural Lightning Bolts
   for(let i=bolts.length-1;i>=0;i--){
    const bt=bolts[i];bt.life+=dt;
    if(bt.life>=bt.maxLife){bolts.splice(i,1);continue}
    const a=1-bt.life/bt.maxLife;
    ctx.lineCap="round";ctx.lineJoin="round";
    ctx.strokeStyle=bt.col;ctx.globalAlpha=a*0.65;ctx.lineWidth=8*a;
    ctx.beginPath();
    bt.pts.forEach((pt,idx)=>idx?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));
    ctx.stroke();
    ctx.strokeStyle="#ffffff";ctx.globalAlpha=a;ctx.lineWidth=2.6*a;
    ctx.beginPath();
    bt.pts.forEach((pt,idx)=>idx?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));
    ctx.stroke();
   }

   // 8. Geometric Hexagonal Energy Barrier (Guard / Perfect Guard)
   for(let i=shields.length-1;i>=0;i--){
    const sh=shields[i];sh.life+=dt;
    if(sh.life>=sh.maxLife){shields.splice(i,1);continue}
    const p=sh.life/sh.maxLife;
    const sc=0.72+0.36*(1-Math.pow(1-p,3));
    const a=(p<0.18?p/0.18:1-(p-0.18)/0.82);
    ctx.save();
    ctx.translate(sh.x,sh.y);ctx.scale(sc,sc);
    // Outer dome glow
    const grad=ctx.createRadialGradient(0,0,sh.r*0.15,0,0,sh.r);
    grad.addColorStop(0,"transparent");
    grad.addColorStop(0.7,sh.pg?"rgba(253,224,71,.22)":"rgba(56,189,248,.2)");
    grad.addColorStop(1,"transparent");
    ctx.globalAlpha=a;ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(0,0,sh.r,0,Math.PI*2);ctx.fill();
    // 7-cell Hex Grid
    const hr=sh.r*0.33;
    ctx.strokeStyle=sh.col;ctx.lineWidth=2;ctx.globalAlpha=a*0.92;
    drawHex(0,0,hr);ctx.stroke();
    for(let k=0;k<6;k++){
     const ang=Math.PI/3*k;
     ctx.globalAlpha=a*0.68;
     drawHex(Math.cos(ang)*hr*1.74,Math.sin(ang)*hr*1.74,hr*0.94);
     ctx.stroke();
    }
    ctx.restore();
   }

   // 9. Expanding Shockwave Rings
   for(let i=rings.length-1;i>=0;i--){
    const rg=rings[i];rg.life+=dt;
    if(rg.life>=rg.maxLife){rings.splice(i,1);continue}
    const p=rg.life/rg.maxLife;
    const ease=1-Math.pow(1-p,3);
    ctx.strokeStyle=rg.col;ctx.globalAlpha=(1-p)*0.92;ctx.lineWidth=rg.lw*(1-p*0.55);
    ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r+(rg.maxR-rg.r)*ease,0,Math.PI*2);ctx.stroke();
   }

   // 10. Velocity-Stretched Spark Streaks & Shards
   for(let i=parts.length-1;i>=0;i--){
    const pt=parts[i];pt.life+=dt;
    if(pt.life>=pt.maxLife){parts.splice(i,1);continue}
    const ox=pt.x,oy=pt.y;
    pt.vy+=(pt.gravity||0)*dt;
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;
    pt.vx*=pt.drag;pt.vy*=pt.drag;
    const a=1-pt.life/pt.maxLife;
    ctx.globalAlpha=a;
    if(pt.shard){
     pt.rot+=pt.vrot*dt;
     ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.rot);
     ctx.fillStyle=pt.col;
     const s=pt.r*1.6*(0.4+a*0.6);
     ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.7,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.7,0);ctx.closePath();ctx.fill();
     ctx.restore();
    }else if(pt.streak){
     ctx.strokeStyle=pt.col;ctx.lineWidth=Math.max(1.2,pt.r*a);ctx.lineCap="round";
     ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(pt.x+(pt.x-ox)*1.8,pt.y+(pt.y-oy)*1.8);ctx.stroke();
    }else{
     ctx.fillStyle=pt.col;
     ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r*(0.4+a*0.6),0,Math.PI*2);ctx.fill();
    }
   }
   ctx.restore();

   // 11. Floating Console Impact Callouts (Normal Composite for Sharp Readability)
   for(let i=texts.length-1;i>=0;i--){
    const tx=texts[i];tx.life+=dt;
    if(tx.life>=tx.maxLife){texts.splice(i,1);continue}
    const p=tx.life/tx.maxLife;
    const sc=p<0.16?(0.6+0.55*(p/0.16)):(1.15-0.15*Math.min(1,(p-0.16)/0.2));
    const a=p<0.72?1:1-(p-0.72)/0.28;
    const yOff=-p*34;
    ctx.save();
    ctx.translate(tx.x,tx.y+yOff);ctx.scale(sc,sc);
    ctx.globalAlpha=a;
    ctx.font=`italic 900 ${tx.size}px system-ui,-apple-system,"Segoe UI",sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=5;ctx.strokeStyle="rgba(4,8,18,.92)";
    ctx.strokeText(tx.txt,0,0);
    ctx.shadowColor=tx.col;ctx.shadowBlur=16;
    ctx.fillStyle=tx.col;
    ctx.fillText(tx.txt,0,0);
    ctx.restore();
   }
  }
  if(active||parts.length||rings.length||beams.length||flashes.length||slashes.length||bolts.length||shields.length||runes.length||speedlines.length||texts.length){
   raf=requestAnimationFrame(loop);
  }else{
   raf=0;
  }
 }
 window.addEventListener("resize",()=>{if(cv){ctx=null;ensure()}});
 return{ensure,spawnBurst,addRing,addBeam,addSlash,addBolt,addShield,addRune,addSpeedlines,addText,addFlash,camShake,shakeMat,hexGuardDome,guardBarrier,slamEl,rideImpact,summonCall,damageHit,cellCenter,attackImpact,triggerFX};
})();
</script>
